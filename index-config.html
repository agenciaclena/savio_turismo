<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Configurações da Loja</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --muted:#6b7280;
}

html,body{
  height:100%;
  background:rgba(0,0,0,.55);
  overflow:hidden;
}

/* MODAL */
.modal{
  background:#fff;
  width:100%;
  height:94vh;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
}

/* BODY */
.body{
  flex:1;
  overflow:auto;
  padding:18px;
  display:grid;
  gap:14px;
}

h4{
  margin-top:10px;
  font-size:14px;
}

/* INPUTS */
label{
  font-size:12px;
  font-weight:700;
  color:#444;
}

input,textarea,select{
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 14px;
  font-size:14px;
}

textarea{
  min-height:90px;
  padding:10px 14px;
  resize:none;
}

/* TOGGLE */
.toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  font-weight:700;
}

.toggle input{display:none}

.switch{
  width:38px;
  height:22px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
}

.switch::after{
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:.2s;
}

.toggle input:checked + .switch{
  background:var(--primary);
}
.toggle input:checked + .switch::after{
  left:18px;
}

/* FOOTER */
.footer{
  padding:16px;
  display:flex;
  gap:12px;
  border-top:1px solid var(--border);
}

button{
  flex:1;
  height:48px;
  border-radius:999px;
  border:none;
  font-weight:900;
  cursor:pointer;
}

.save{background:var(--primary);color:#fff}
.cancel{background:#e5e7eb}
</style>
</head>

<body>

<div class="modal">

  <div class="header">
    <span>Configurações da Loja</span>
    <span onclick="fechar()">✕</span>
  </div>

  <div class="body">

    <!-- VISUAL -->
    <h4>🎨 Visual</h4>

    <label>Nome da loja</label>
    <input id="nome_loja">

    <label>Cor primária</label>
    <input type="color" id="cor_primaria">

    <label>Cor de fundo</label>
    <input type="color" id="cor_fundo">

    <label>Cor dos cards</label>
    <input type="color" id="cor_card">

    <label>Cor do texto</label>
    <input type="color" id="cor_texto">

    <!-- BANNERS -->
    <h4>🖼️ Banners</h4>

    <label>URLs (uma por linha)</label>
    <textarea id="banners" placeholder="https://..."></textarea>

    <label>Efeito</label>
    <select id="banner_efeito">
      <option value="slide">Slide</option>
      <option value="fade">Fade</option>
    </select>

    <label>Intervalo (ms)</label>
    <input type="number" id="banner_intervalo">

    <!-- ÚLTIMAS VAGAS -->
    <h4>🚨 Últimas vagas</h4>

    <label class="toggle">
      <span>Ativar alerta</span>
      <input type="checkbox" id="uv_ativo">
      <div class="switch"></div>
    </label>

    <label>Dias antes da viagem</label>
    <input type="number" id="uv_dias">

    <label>Texto exibido</label>
    <input id="uv_texto">

    <label>Cor do alerta</label>
    <input type="color" id="uv_cor">

    <label class="toggle">
      <span>Piscar alerta</span>
      <input type="checkbox" id="uv_piscar">
      <div class="switch"></div>
    </label>

  </div>

  <div class="footer">
    <button class="cancel" onclick="fechar()">Cancelar</button>
    <button class="save" onclick="salvar()">Salvar</button>
  </div>

</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let configId = null;

(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    location.href="login.html";
    return;
  }

  const { data, error } = await sb
    .from("loja_config")
    .select("*")
    .single();

  if(error){
    alert("Erro ao carregar configurações");
    return;
  }

  configId = data.id;

  nome_loja.value = data.nome_loja || "";
  cor_primaria.value = data.cor_primaria || "#ff6a00";
  cor_fundo.value = data.cor_fundo || "#f4f6fb";
  cor_card.value = data.cor_card || "#ffffff";
  cor_texto.value = data.cor_texto || "#111827";

  banners.value = (data.banners || []).join("\n");
  banner_efeito.value = data.banner_efeito || "slide";
  banner_intervalo.value = data.banner_intervalo || 2000;

  uv_ativo.checked = !!data.ultimas_vagas_ativo;
  uv_dias.value = data.ultimas_vagas_dias || 7;
  uv_texto.value = data.ultimas_vagas_texto || "Últimas vagas";
  uv_cor.value = data.ultimas_vagas_cor || "#dc2626";
  uv_piscar.checked = !!data.ultimas_vagas_piscar;
})();

async function salvar(){
  const payload = {
    nome_loja: nome_loja.value,
    cor_primaria: cor_primaria.value,
    cor_fundo: cor_fundo.value,
    cor_card: cor_card.value,
    cor_texto: cor_texto.value,

    banners: banners.value.split("\n").filter(Boolean),
    banner_efeito: banner_efeito.value,
    banner_intervalo: Number(banner_intervalo.value),

    ultimas_vagas_ativo: uv_ativo.checked,
    ultimas_vagas_dias: Number(uv_dias.value),
    ultimas_vagas_texto: uv_texto.value,
    ultimas_vagas_cor: uv_cor.value,
    ultimas_vagas_piscar: uv_piscar.checked
  };

  const { error } = await sb
    .from("loja_config")
    .update(payload)
    .eq("id", configId);

  if(error){
    alert("Erro ao salvar");
    return;
  }

  alert("Configurações salvas ✅");
  fechar();
}

function fechar(){
  window.parent.postMessage("fechar","*");
}
</script>

</body>
</html>
