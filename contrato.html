<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CONTRATO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter;padding:40px}
</style>
</head>
<body>

<h2>CONTRATO DE PRESTAÇÃO DE SERVIÇOS</h2>
<p id="texto"></p>
<img id="assin" style="max-width:300px">

<script>
const d = JSON.parse(localStorage.getItem("cadastro_savio")||"{}");
document.getElementById("texto").innerText =
  `Eu, ${d.nome}, CPF ${d.cpf}, aceito os termos do contrato.`;

const a = localStorage.getItem("assinatura_base64");
if(a) document.getElementById("assin").src=a;
</script>

</body>
</html>
