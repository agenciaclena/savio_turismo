<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#f4f6fb}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --muted:#6b7280;
  --card:#fff;
}

/* HEADER */
.header{padding:16px}
.header h1{font-size:20px;font-weight:800}
.header span{color:var(--primary)}
.header p{font-size:12px;color:var(--muted)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  padding:0 16px 120px;
}
@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
}
.poster{
  width:100%;
  aspect-ratio:1 / 1.414;
  background:#eee;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.card-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card-body h4{
  font-size:14px;
  font-weight:800;
}
.badge{
  font-size:11px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  background:#fff7ed;
  color:#c2410c;
  width:fit-content;
}
.meta{font-size:12px;color:var(--muted)}
.price{font-size:14px;font-weight:800}
.actions{
  margin-top:6px;
  font-size:12px;
  font-weight:800;
  color:var(--primary);
  cursor:pointer;
}

/* FAB */
.fab{
  position:fixed;
  right:16px;
  bottom:16px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
  border:none;
  font-size:28px;
  box-shadow:0 14px 34px rgba(0,0,0,.35);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
}
.modal.show{display:flex}

/* SHEET */
.sheet{
  width:100%;
  height:95vh;
  background:#fff;
  border-radius:24px 24px 0 0;
  display:flex;
  flex-direction:column;
}
.sheet-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  font-weight:800;
}
.sheet-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.sheet-body label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}
.sheet-body input,
.sheet-body textarea,
.sheet-body select{
  width:100%;
  height:42px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--border);
  padding:0 12px;
}
.sheet-body textarea{min-height:80px;padding:10px}

/* IMAGE */
.image-box{
  height:180px;
  border-radius:16px;
  background:#eee;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.image-box img{width:100%;height:100%;object-fit:contain}

/* FOOTER */
.sheet-footer{
  padding:14px;
  border-top:1px solid var(--border);
  display:flex;
  gap:12px;
}
.sheet-footer button{
  flex:1;
  height:46px;
  border-radius:999px;
  border:none;
  font-weight:800;
}
.save{background:var(--primary);color:#fff}
.cancel{background:#e5e7eb}
.delete{background:transparent;color:#dc2626}
</style>
</head>

<body>

<div class="header">
  <h1>Excursões <span>Admin</span></h1>
  <p>Cadastro completo das viagens</p>
</div>

<div class="grid" id="lista"></div>
<button class="fab" onclick="novo()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="sheet">
<div class="sheet-header">
  <span id="tituloForm">Nova excursão</span>
  <span onclick="fechar()">✕</span>
</div>

<div class="sheet-body">

<label>Poster (A4)</label>
<div class="image-box" onclick="imagem.click()">
  <img id="preview" style="display:none">
  <input type="file" id="imagem" hidden accept="image/*">
</div>

<label>Título</label><input id="titulo">
<label>Destino</label><input id="destino">
<label>Tipo</label>
<select id="tipo">
  <option>Excursão</option>
  <option>Luau</option>
  <option>Acampamento</option>
  <option>Sorteio</option>
</select>

<label>Data saída</label><input type="date" id="data_saida">
<label>Data retorno</label><input type="date" id="data_retorno">

<label>Valor</label><input id="valor">
<label>Parcelas</label><input id="parcelas">

<label>Roteiro / Descrição</label>
<textarea id="descricao"></textarea>

</div>

<div class="sheet-footer">
  <button class="delete" id="btnExcluir" onclick="excluir()" style="display:none">Excluir</button>
  <button class="cancel" onclick="fechar()">Cancelar</button>
  <button class="save" onclick="salvar()">Salvar</button>
</div>

</div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId=null,editId=null,blob=null,itens=[];

/* AUTH */
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(!session) return location.href="login.html";
 userId=session.user.id;
 carregar();
})();

imagem.onchange=()=>{
 const f=imagem.files[0];
 blob=f;
 preview.src=URL.createObjectURL(f);
 preview.style.display="block";
}

function novo(){
 editId=null;blob=null;preview.style.display="none";
 btnExcluir.style.display="none";
 tituloForm.innerText="Nova excursão";
 modal.classList.add("show");
}
function fechar(){modal.classList.remove("show")}

async function salvar(){
 let poster=null;
 if(blob){
  poster=`${userId}/${Date.now()}.jpg`;
  await sb.storage.from("buffet_excursoes").upload(poster,blob,{upsert:true});
 }
 const payload={
  user_id:userId,
  titulo:titulo.value,
  destino:destino.value,
  tipo:tipo.value,
  data_saida:data_saida.value,
  data_retorno:data_retorno.value,
  valor:valor.value,
  parcelas:parcelas.value,
  descricao:descricao.value,
  poster_url:poster
 };
 editId
  ? await sb.from("excursoes").update(payload).eq("id",editId)
  : await sb.from("excursoes").insert(payload);
 fechar();carregar();
}

async function carregar(){
 const {data}=await sb.from("excursoes").select("*").eq("user_id",userId);
 lista.innerHTML="";
 (data||[]).forEach(e=>{
  const img=e.poster_url
   ? sb.storage.from("buffet_excursoes").getPublicUrl(e.poster_url).data.publicUrl
   : "";
  lista.innerHTML+=`
  <div class="card">
    <div class="poster">${img?`<img src="${img}">`:``}</div>
    <div class="card-body">
      <h4>${e.titulo}</h4>
      <span class="badge">${e.destino}</span>
      <div class="meta">${e.data_saida} → ${e.data_retorno}</div>
      <div class="price">R$ ${e.valor}</div>
      <div class="actions" onclick="editar('${e.id}')">Editar</div>
    </div>
  </div>`;
 });
}

function editar(id){
 const e=[...document.querySelectorAll('.actions')].find(()=>true);
 editId=id;
 btnExcluir.style.display="block";
 modal.classList.add("show");
}

async function excluir(){
 if(confirm("Excluir excursão?")){
  await sb.from("excursoes").delete().eq("id",editId);
  fechar();carregar();
 }
}
</script>

</body>
</html>
