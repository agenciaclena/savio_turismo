<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin • Excursões</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#f4f6fb;color:#111}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --muted:#6b7280;
}

/* HEADER */
.header{padding:20px}
.header h1{font-size:22px;font-weight:800}
.header span{color:var(--primary)}
.header p{font-size:13px;color:var(--muted)}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:0 20px 140px;
}
@media(max-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}

/* CARD */
.card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
}
.poster{
  width:100%;
  max-height:420px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
}
.poster img{
  width:100%;
  height:auto;
  max-height:100%;
  object-fit:contain;
}
.poster{
  width:100%;
  aspect-ratio:1 / 1.414;
  max-height:60vh;
  background:#eee;
}

.card-body{padding:14px;display:flex;flex-direction:column;gap:8px}
.card-body h4{font-size:15px;font-weight:800}

/* FLAGS */
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{
  width:10px;height:10px;border-radius:50%;
  background:#cbd5e1;
}
.flag.on{background:var(--primary)}

.meta{font-size:12px;color:var(--muted)}
.price{font-size:15px;font-weight:900}
.edit{color:var(--primary);font-weight:800;cursor:pointer}

/* FAB */
.fab{
  position:fixed;right:20px;bottom:20px;
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;font-size:30px;border:none;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;
}
.modal.show{display:flex}

.sheet{
  background:#fff;width:100%;height:95vh;
  border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;
}
.sheet-header{
  padding:18px;border-bottom:1px solid var(--border);
  font-weight:800;display:flex;justify-content:space-between
}
.sheet-body{
  flex:1;overflow:auto;padding:18px;
  display:grid;gap:12px
}
.sheet-body label{font-size:12px;font-weight:700;color:#555}
.sheet-body input,.sheet-body select,.sheet-body textarea{
  height:44px;border-radius:14px;border:1px solid var(--border);
  padding:0 14px
}
.sheet-body textarea{min-height:90px;padding:10px}

.image-box{
  height:220px;border-radius:18px;background:#eee;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer
}
.image-box img{width:100%;height:100%;object-fit:contain}

.checks{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px
}
.checks label{display:flex;gap:8px;font-size:13px;font-weight:700}

.sheet-footer{
  padding:16px;border-top:1px solid var(--border);
  display:flex;gap:12px
}
.sheet-footer button{
  flex:1;height:48px;border-radius:999px;
  border:none;font-weight:900;cursor:pointer
}
.save{background:var(--primary);color:#fff}
.cancel{background:#e5e7eb}
.delete{background:transparent;color:#dc2626}

/* ===== TOGGLE FLAGS (BONITAS) ===== */
.toggle-group{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:6px;
}

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  background:#fff;
  cursor:pointer;
}

.toggle span{
  display:flex;
  align-items:center;
  gap:8px;
}

/* esconde checkbox real */
.toggle input{
  display:none;
}

/* switch */
.toggle .switch{
  width:38px;
  height:22px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
  transition:.25s;
}

.toggle .switch::after{
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:.25s;
}

/* ativo */
.toggle input:checked + .switch{
  background:var(--primary);
}
.toggle input:checked + .switch::after{
  left:18px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  font-size:11px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  background:#fff7ed;
  color:#c2410c;
  border:1px solid #fed7aa;
}

</style>
</head>

<body>

<div class="header">
  <h1>Excursões <span>Admin</span></h1>
  <p>Cadastro completo das viagens</p>
</div>

<div class="grid" id="lista"></div>
<button class="fab" onclick="novo()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="sheet">
<div class="sheet-header">
  <span id="tituloForm">Nova excursão</span>
  <span onclick="fechar()">✕</span>
</div>

<div class="sheet-body">

<label>Poster A4</label>
<div class="image-box" onclick="imagem.click()">
  <img id="preview" style="display:none">
  <input type="file" id="imagem" hidden accept="image/*">
</div>

<label>Título</label><input id="titulo">
<label>Destino</label><input id="destino">

<label>Tipo</label>
<select id="tipo">
  <option>Excursão</option>
  <option>Luau</option>
  <option>Acampamento</option>
  <option>Sorteio</option>
</select>

<label>Data saída</label><input type="date" id="data_saida">
<label>Hora saída</label><input type="time" id="hora_saida">

<label>Data retorno</label><input type="date" id="data_retorno">
<label>Hora retorno</label><input type="time" id="hora_retorno">

<label>Duração (dias)</label><input id="duracao_dias">
<label>Local saída</label><input id="local_saida">
<label>Transporte</label><input id="transporte">
<label>Hospedagem</label><input id="hospedagem">
<label>Alimentação</label><input id="alimentacao">

<label>Inclusos</label>

<div class="checks">
  <label><input type="checkbox" id="inclui_transporte"> Transporte</label>
  <label><input type="checkbox" id="inclui_hospedagem"> Hospedagem</label>
  <label><input type="checkbox" id="inclui_cafe"> Café</label>
  <label><input type="checkbox" id="inclui_almoco"> Almoço</label>
  <label><input type="checkbox" id="inclui_jantar"> Jantar</label>
  <label><input type="checkbox" id="inclui_seguro"> Seguro</label>
  <label><input type="checkbox" id="inclui_guia"> Guia</label>
</div>

<label>Formas de pagamento</label>

<div class="toggle-group">

  <label class="toggle">
    <span>💳 Pix</span>
    <input type="checkbox" id="pag_pix">
    <div class="switch"></div>
  </label>

  <label class="toggle">
    <span>💳 Crédito</span>
    <input type="checkbox" id="pag_credito">
    <div class="switch"></div>
  </label>

  <label class="toggle">
    <span>💳 Débito</span>
    <input type="checkbox" id="pag_debito">
    <div class="switch"></div>
  </label>

  <label class="toggle">
    <span>💵 Dinheiro</span>
    <input type="checkbox" id="pag_dinheiro">
    <div class="switch"></div>
  </label>

  <label class="toggle">
    <span>📆 Parcelado</span>
    <input type="checkbox" id="pag_parcelado">
    <div class="switch"></div>
  </label>
</div>
<label>Roteiro</label><textarea id="roteiro"></textarea>
<label>Valor</label>
<input id="valor" inputmode="numeric" placeholder="R$ 0,00">
<label>Parcelas</label><input id="parcelas">
<label>Observações</label><textarea id="observacoes"></textarea>

<label>Status</label>
<select id="status">
  <option value="Ativa">Ativa</option>
  <option value="Inativa">Inativa</option>
  <option value="Esgotada">Esgotada</option>
</select>


</div>

<div class="sheet-footer">
  <button class="delete" id="btnExcluir" onclick="excluir()" style="display:none">Excluir</button>
  <button class="cancel" onclick="fechar()">Cancelar</button>
  <button class="save" onclick="salvar()">Salvar</button>
</div>

</div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId, editId=null, blob=null, itens=[];

(async()=>{
 const {data:{session}} = await sb.auth.getSession();
 if(!session) location.href="login.html";
 userId = session.user.id;
 carregar();
})();
valor.addEventListener("input", ()=>{
  let v = valor.value.replace(/\D/g,"");
  v = (Number(v) / 100).toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
  valor.value = v;
});

imagem.onchange = () =>{
 blob = imagem.files[0];
 preview.src = URL.createObjectURL(blob);
 preview.style.display="block";
}

function novo(){
 editId=null; blob=null;
 preview.style.display="none";
 btnExcluir.style.display="none";
 tituloForm.innerText="Nova excursão";
 modal.classList.add("show");
document.querySelectorAll(".sheet-body input, .sheet-body textarea").forEach(el=>{
  if(el.type==="checkbox") el.checked=false;
  else el.value="";
});

status.value="Ativa";
preview.style.display="none";
blob=null;
pag_pix.checked = false;
pag_credito.checked = false;
pag_debito.checked = false;
pag_dinheiro.checked = false;
pag_parcelado.checked = false;


  
}

function fechar(){ modal.classList.remove("show"); }

async function salvar(){
let poster = editId
 ? itens.find(i=>i.id===editId)?.poster_url
 : null;

 if(blob){
  poster = `${userId}/${Date.now()}.jpg`;
  await sb.storage.from("buffet_excursoes").upload(poster, blob, { upsert:true });
 }

const payload={
  user_id:userId,
  titulo:titulo.value || null,
  destino:destino.value || null,
  tipo:tipo.value || "Excursão",

  data_saida:data_saida.value || null,
  hora_saida:hora_saida.value || null,
  data_retorno:data_retorno.value || null,
  hora_retorno:hora_retorno.value || null,

  duracao_dias:Number(duracao_dias.value) || null,
  local_saida:local_saida.value || null,
  transporte:transporte.value || null,
  hospedagem:hospedagem.value || null,
  alimentacao:alimentacao.value || null,

  inclui_transporte:!!inclui_transporte.checked,
  inclui_hospedagem:!!inclui_hospedagem.checked,
  inclui_cafe:!!inclui_cafe.checked,
  inclui_almoco:!!inclui_almoco.checked,
  inclui_jantar:!!inclui_jantar.checked,
  inclui_seguro:!!inclui_seguro.checked,
  inclui_guia:!!inclui_guia.checked,

  roteiro:roteiro.value || null,
valor: limparMoeda(valor.value),
  parcelas:Number(parcelas.value) || 0,
 observacoes:observacoes.value || null,

pag_pix: !!pag_pix.checked,
pag_credito: !!pag_credito.checked,
pag_debito: !!pag_debito.checked,
pag_dinheiro: !!pag_dinheiro.checked,
pag_parcelado: !!pag_parcelado.checked,

status:status.value || "Ativa",
poster_url:poster
};

const { error } = editId
 ? await sb.from("excursoes").update(payload).eq("id",editId)
 : await sb.from("excursoes").insert(payload);

if(error){
 alert("Erro ao salvar: " + error.message);
 return;
}

 fechar();
 carregar();
}

/* ================= FORMATADORES ================= */
function formatarData(data){
  if(!data) return "";
  const [ano, mes, dia] = data.split("-");
  return `${dia}/${mes}/${ano}`;
}

function formatarHora(hora){
  if(!hora) return "";
  return hora.slice(0,5); // hh:mm
}
function formatarMoeda(valor){
  if(valor === null || valor === undefined) return "R$ 0,00";
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function limparMoeda(valor){
  if(!valor) return 0;
  return Number(
    valor
      .replace(/\./g,"")
      .replace(",",".")
      .replace(/[^\d.]/g,"")
  );
}



  
async function carregar(){
 const {data} = await sb.from("excursoes").select("*").eq("user_id",userId);
 itens = data || [];
 lista.innerHTML="";

 itens.forEach(e=>{
  const img = e.poster_url
   ? sb.storage.from("buffet_excursoes").getPublicUrl(e.poster_url).data.publicUrl
   : "";

  lista.innerHTML += `
  <div class="card">
    <div class="poster">${img?`<img src="${img}">`:``}</div>
    <div class="card-body">
      <h4>${e.titulo}</h4>



      
      <div class="tags">
  ${e.inclui_transporte ? `<span class="tag">Transporte</span>` : ``}
  ${e.inclui_hospedagem ? `<span class="tag">Hospedagem</span>` : ``}
  ${e.inclui_cafe ? `<span class="tag">Café</span>` : ``}
  ${e.inclui_almoco ? `<span class="tag">Almoço</span>` : ``}
  ${e.inclui_jantar ? `<span class="tag">Jantar</span>` : ``}
</div>

<div class="tags">
  ${e.pag_pix ? `<span class="tag">Pix</span>` : ``}
  ${e.pag_credito ? `<span class="tag">Crédito</span>` : ``}
  ${e.pag_debito ? `<span class="tag">Débito</span>` : ``}
  ${e.pag_dinheiro ? `<span class="tag">Dinheiro</span>` : ``}
  ${e.pag_parcelado ? `<span class="tag">Parcelado</span>` : ``}
</div>




      
      <div class="meta">${e.destino}</div>
<div class="meta">
  ${formatarData(e.data_saida)} ${formatarHora(e.hora_saida)}
  →
  ${formatarData(e.data_retorno)} ${formatarHora(e.hora_retorno)}
</div>
<div class="price">${formatarMoeda(e.valor)}</div>
      <div class="edit" onclick="editar('${e.id}')">Editar</div>
    </div>
  </div>`;
 });
}

function editar(id){
 const e = itens.find(i => i.id === id);
 if(!e) return;

 editId = id;
 btnExcluir.style.display = "block";
 tituloForm.innerText = "Editar excursão";

 // TEXTOS
 titulo.value = e.titulo || "";
 destino.value = e.destino || "";
 tipo.value = e.tipo || "Excursão";
 data_saida.value = e.data_saida || "";
 hora_saida.value = e.hora_saida || "";
 data_retorno.value = e.data_retorno || "";
 hora_retorno.value = e.hora_retorno || "";
 duracao_dias.value = e.duracao_dias || "";
 local_saida.value = e.local_saida || "";
 transporte.value = e.transporte || "";
 hospedagem.value = e.hospedagem || "";
 alimentacao.value = e.alimentacao || "";
 roteiro.value = e.roteiro || "";
valor.value = formatarMoeda(e.valor);
 parcelas.value = e.parcelas || "";
 observacoes.value = e.observacoes || "";

 // ✅ STATUS (AQUI ESTÁ A CORREÇÃO)
 status.value = e.status || "Ativa";

 // CHECKBOX
 inclui_transporte.checked = !!e.inclui_transporte;
 inclui_hospedagem.checked = !!e.inclui_hospedagem;
 inclui_cafe.checked = !!e.inclui_cafe;
 inclui_almoco.checked = !!e.inclui_almoco;
 inclui_jantar.checked = !!e.inclui_jantar;
 inclui_seguro.checked = !!e.inclui_seguro;
 inclui_guia.checked = !!e.inclui_guia;
  pag_pix.checked = !!e.pag_pix;
pag_credito.checked = !!e.pag_credito;
pag_debito.checked = !!e.pag_debito;
pag_dinheiro.checked = !!e.pag_dinheiro;
pag_parcelado.checked = !!e.pag_parcelado;


 // IMAGEM
 if(e.poster_url){
  preview.src = sb.storage
    .from("buffet_excursoes")
    .getPublicUrl(e.poster_url).data.publicUrl;
  preview.style.display = "block";
 } else {
  preview.style.display = "none";
 }

 modal.classList.add("show");
}


async function excluir(){
 if(confirm("Excluir excursão?")){
  await sb.from("excursoes").delete().eq("id",editId);
  fechar();
  carregar();
 }
}
</script>

</body>
</html>
