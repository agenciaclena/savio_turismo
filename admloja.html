<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter, system-ui, Arial, sans-serif;
}

body{
  background:#f4f6fb;
  color:#111827;
}

/* ================= VARIÁVEIS ================= */
:root{
  --primary:#ff6a00;
  --primary-soft:rgba(255,106,0,.12);
  --border:#e5e7eb;
  --muted:#6b7280;
  --card:#ffffff;
  --success:#16a34a;
  --danger:#dc2626;
}

/* ================= HEADER ================= */
.header{
  padding:20px 16px 12px;
}
.header h1{
  font-size:22px;
  font-weight:800;
}
.header span{color:var(--primary)}
.header p{
  font-size:13px;
  color:var(--muted);
}

/* ================= GRID ================= */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  padding:0 16px 140px;
}

@media(max-width:1024px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

/* ================= CARD ================= */
.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
  transition:.2s;
}
.card:hover{
  transform:translateY(-4px);
}

/* Poster A4 */
.poster{
  width:100%;
  aspect-ratio:1 / 1.414;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* Corpo do card */
.card-body{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card-body h4{
  font-size:15px;
  font-weight:800;
  line-height:1.2;
}

/* ================= BADGES / FLAGS ================= */
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  font-size:11px;
  font-weight:800;
  padding:5px 12px;
  border-radius:999px;
  background:#f1f5f9;
  color:#334155;
}

/* status */
.badge.ativa{
  background:#dcfce7;
  color:#166534;
}
.badge.inativa{
  background:#fee2e2;
  color:#991b1b;
}
.badge.esgotada{
  background:#fff7ed;
  color:#c2410c;
}

/* inclusos */
.badge.incluso{
  background:#e0f2fe;
  color:#0369a1;
}

/* ================= META ================= */
.meta{
  font-size:12px;
  color:var(--muted);
  line-height:1.3;
}

.price{
  font-size:15px;
  font-weight:900;
  color:#111;
}

/* ================= ACTION ================= */
.actions{
  margin-top:8px;
  font-size:13px;
  font-weight:800;
  color:var(--primary);
  cursor:pointer;
}

/* ================= FAB ================= */
.fab{
  position:fixed;
  right:18px;
  bottom:18px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
  border:none;
  font-size:30px;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
  cursor:pointer;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  z-index:9999;
}
.modal.show{display:flex}

/* ================= SHEET ================= */
.sheet{
  width:100%;
  height:95vh;
  background:#fff;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}

/* header */
.sheet-header{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
  font-size:16px;
}

/* body */
.sheet-body{
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:grid;
  gap:14px;
}

.sheet-body label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

/* inputs */
.sheet-body input,
.sheet-body textarea,
.sheet-body select{
  width:100%;
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 14px;
  font-size:14px;
}
.sheet-body textarea{
  min-height:100px;
  padding:12px 14px;
}

/* ================= IMAGE UPLOAD ================= */
.image-box{
  height:220px;
  border-radius:18px;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  overflow:hidden;
}
.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ================= CHECKBOX / FLAGS ================= */
.checks{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.checks label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  font-weight:700;
  color:#111;
}

.checks input{
  width:18px;
  height:18px;
}

/* ================= FOOTER ================= */
.sheet-footer{
  padding:16px;
  border-top:1px solid var(--border);
  display:flex;
  gap:12px;
  background:#fff;
}

.sheet-footer button{
  flex:1;
  height:48px;
  border-radius:999px;
  border:none;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
}

.save{
  background:var(--primary);
  color:#fff;
}
.cancel{
  background:#e5e7eb;
}
.delete{
  background:transparent;
  color:var(--danger);
  font-size:12px;
}

</style>
</head>

<body>

<div class="header">
  <h1>Excursões <span>Admin</span></h1>
  <p>Cadastro completo das viagens</p>
</div>

<div class="grid" id="lista"></div>
<button class="fab" onclick="novo()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="sheet">
<div class="sheet-header">
  <span id="tituloForm">Nova excursão</span>
  <span onclick="fechar()">✕</span>
</div>

<div class="sheet-body">

<label>Poster A4</label>
<div class="image-box" onclick="imagem.click()">
  <img id="preview" style="display:none">
  <input type="file" id="imagem" hidden accept="image/*">
</div>

<label>Título</label><input id="titulo">
<label>Destino</label><input id="destino">

<label>Tipo</label>
<select id="tipo">
  <option>Excursão</option>
  <option>Luau</option>
  <option>Acampamento</option>
  <option>Sorteio</option>
</select>

<label>Data saída</label><input type="date" id="data_saida">
<label>Hora saída</label><input type="time" id="hora_saida">

<label>Data retorno</label><input type="date" id="data_retorno">
<label>Hora retorno</label><input type="time" id="hora_retorno">

<label>Duração (dias)</label><input type="number" id="duracao_dias">

<label>Local de saída</label><input id="local_saida">
<label>Transporte</label><input id="transporte">
<label>Hospedagem</label><input id="hospedagem">

<label>Alimentação</label><input id="alimentacao">

<label>Inclusos</label>
<div class="checks">
  <label><input type="checkbox" id="inclui_transporte"> Transporte</label>
  <label><input type="checkbox" id="inclui_hospedagem"> Hospedagem</label>
  <label><input type="checkbox" id="inclui_cafe"> Café</label>
  <label><input type="checkbox" id="inclui_almoco"> Almoço</label>
  <label><input type="checkbox" id="inclui_jantar"> Jantar</label>
  <label><input type="checkbox" id="inclui_seguro"> Seguro</label>
  <label><input type="checkbox" id="inclui_guia"> Guia</label>
</div>

<label>Roteiro completo</label>
<textarea id="roteiro"></textarea>

<label>Valor</label><input id="valor">
<label>Parcelas</label><input id="parcelas">

<label>Observações</label>
<textarea id="observacoes"></textarea>

<label>Status</label>
<select id="status">
  <option>Ativa</option>
  <option>Inativa</option>
  <option>Esgotada</option>
</select>

</div>

<div class="sheet-footer">
  <button class="delete" id="btnExcluir" onclick="excluir()" style="display:none">Excluir</button>
  <button class="cancel" onclick="fechar()">Cancelar</button>
  <button class="save" onclick="salvar()">Salvar</button>
</div>

</div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId,editId=null,blob=null,itens=[];

(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(!session) location.href="login.html";
 userId=session.user.id;
 carregar();
})();

imagem.onchange=()=>{
 blob=imagem.files[0];
 preview.src=URL.createObjectURL(blob);
 preview.style.display="block";
};

function novo(){
 editId=null;blob=null;preview.style.display="none";
 btnExcluir.style.display="none";
 modal.classList.add("show");
}

function fechar(){modal.classList.remove("show")}

async function salvar(){
 let poster=null;
 if(blob){
  poster=`${userId}/${Date.now()}.jpg`;
  await sb.storage.from("buffet_excursoes").upload(poster,blob,{upsert:true});
 }
 const payload={
  user_id:userId,
  titulo:titulo.value,
  destino:destino.value,
  tipo:tipo.value,
  data_saida:data_saida.value,
  hora_saida:hora_saida.value,
  data_retorno:data_retorno.value,
  hora_retorno:hora_retorno.value,
  duracao_dias:duracao_dias.value,
  local_saida:local_saida.value,
  transporte:transporte.value,
  hospedagem:hospedagem.value,
  alimentacao:alimentacao.value,
  inclui_transporte:inclui_transporte.checked,
  inclui_hospedagem:inclui_hospedagem.checked,
  inclui_cafe:inclui_cafe.checked,
  inclui_almoco:inclui_almoco.checked,
  inclui_jantar:inclui_jantar.checked,
  inclui_seguro:inclui_seguro.checked,
  inclui_guia:inclui_guia.checked,
  roteiro:roteiro.value,
  valor:valor.value,
  parcelas:parcelas.value,
  observacoes:observacoes.value,
  status:status.value,
  poster_url:poster
 };
 editId
  ? await sb.from("excursoes").update(payload).eq("id",editId)
  : await sb.from("excursoes").insert(payload);
 fechar();carregar();
}

async function carregar(){
 const {data}=await sb.from("excursoes").select("*").eq("user_id",userId);
 lista.innerHTML="";
 (data||[]).forEach(e=>{
  const img=e.poster_url
   ? sb.storage.from("buffet_excursoes").getPublicUrl(e.poster_url).data.publicUrl
   : "";
  lista.innerHTML+=`
  <div class="card">
    <div class="poster">${img?`<img src="${img}">`:``}</div>
    <div class="card-body">
      <h4>${e.titulo}</h4>
      <span class="badge">${e.status}</span>
      <div class="meta">${e.destino}</div>
      <div class="meta">${e.data_saida} → ${e.data_retorno}</div>
      <div class="price">R$ ${e.valor}</div>
      <div class="actions" onclick="editar('${e.id}')">Editar</div>
    </div>
  </div>`;
 });
}

async function excluir(){
 if(confirm("Excluir excursão?")){
  await sb.from("excursoes").delete().eq("id",editId);
  fechar();carregar();
 }
}
</script>

</body>
</html>
