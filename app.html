<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Admin</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<meta name="theme-color" content="#ff6a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#f5f7fb;
  overflow:hidden;
}

/* VARS */
:root{
  --primary:#ff6a00;
  --card:#ffffff;
  --border:#e6e8ef;
  --text:#111827;
  --muted:#6b7280;
}

/* HEADER */
.header{
  padding:14px 14px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{
  font-size:17px;
  font-weight:800;
}
.header p{
  font-size:11px;
  color:var(--muted);
}

/* CALENDÁRIO */
.calendar{
  padding:10px 12px;
  overflow-x:auto;
  display:flex;
  gap:10px;
}

.day{
  min-width:130px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.day strong{
  font-size:12px;
}

.day span{
  font-size:11px;
  color:#374151;
}

/* GRID BOTÕES */
.grid{
  flex:1;
  padding:10px 10px env(safe-area-inset-bottom);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  overflow-y:auto;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--border);
  aspect-ratio:1/1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  text-align:center;
}

.card:active{
  transform:scale(.94);
}

/* ÍCONE */
.icon{
  font-size:20px;
}

/* TEXTO */
.card span{
  font-size:10px;
  font-weight:800;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}
.popup iframe{
  width:100%;
  height:100%;
  border:none;
}
.close{
  position:fixed;
  top:10px;
  right:10px;
  z-index:10000;
  background:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-weight:800;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Painel Admin</h1>
    <p>Resumo e controle</p>
  </div>
</div>

<!-- CALENDÁRIO -->
<div class="calendar" id="calendar"></div>

<!-- GRID DE BOTÕES -->
<div class="grid">

  <div class="card" onclick="abrir('index-parcerias.html')">
    <div class="icon">🤝</div>
    <span>Parcerias</span>
  </div>

  <div class="card" onclick="abrir('excursões.html')">
    <div class="icon">🚌</div>
    <span>Excursões</span>
  </div>

  <div class="card">
    <div class="icon">🖼️</div>
    <span>Banners</span>
  </div>

  <div class="card">
    <div class="icon">⚙️</div>
    <span>Config</span>
  </div>

  <div class="card">
    <div class="icon">👥</div>
    <span>Usuários</span>
  </div>

  <div class="card">
    <div class="icon">📊</div>
    <span>Relatórios</span>
  </div>

  <div class="card">
    <div class="icon">💳</div>
    <span>Pagamentos</span>
  </div>

  <div class="card">
    <div class="icon">📍</div>
    <span>Locais</span>
  </div>

  <div class="card">
    <div class="icon">📨</div>
    <span>Mensagens</span>
  </div>

  <div class="card">
    <div class="icon">🧩</div>
    <span>Módulos</span>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="close" onclick="fechar()">✕</div>
  <iframe id="frame"></iframe>
</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

/* 🔐 LOGIN */
(async()=>{
  const { data:{session} } = await sb.auth.getSession();
  if(!session){
    location.replace("login.html");
    return;
  }
  carregarCalendario();
})();

/* 📅 CALENDÁRIO */
async function carregarCalendario(){
  const { data } = await sb
    .from("excursoes")
    .select("id,destino,data_saida,hora_saida")
    .eq("status","Ativa")
    .order("data_saida",{ascending:true});

  calendar.innerHTML="";

  data.forEach(v=>{
    const d = document.createElement("div");
    d.className="day";
    d.innerHTML=`
      <strong>${formatarData(v.data_saida)}</strong>
      <span>${v.destino}</span>
      <span>🕒 ${v.hora_saida?.slice(0,5) || "--:--"}</span>
      <span>👥 0 passageiros</span>
    `;
    calendar.appendChild(d);
  });
}

function formatarData(data){
  const [a,m,d] = data.split("-");
  return `${d}/${m}`;
}

/* POPUP */
function abrir(url){
  frame.src=url;
  popup.style.display="block";
}
function fechar(){
  frame.src="";
  popup.style.display="none";
}

/* 🔒 BLOQUEIOS */
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
</script>

</body>
</html>
