<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Administrativo</title>

<!-- VIEWPORT / FULLSCREEN -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Admin">
<meta name="mobile-web-app-capable" content="yes">

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
html,body{
  height:100%;
  background:#f4f6fb;
  overflow:hidden; /* 🔒 SEM BARRA */
}

:root{
  --primary:#ff6a00;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
}

/* HEADER */
.header{
  padding:20px env(safe-area-inset-left) 16px env(safe-area-inset-right);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{
  font-size:20px;
  font-weight:800;
}
.header p{
  font-size:12px;
  color:var(--muted);
}

/* SINO */
.notify{
  position:relative;
  font-size:22px;
  cursor:pointer;
}
.badge{
  position:absolute;
  top:-4px;
  right:-6px;
  background:#dc2626;
  color:#fff;
  font-size:10px;
  font-weight:900;
  border-radius:999px;
  padding:2px 6px;
}

/* GRID – SEMPRE 5 POR LINHA */
.grid{
  padding:0 12px env(safe-area-inset-bottom);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  height:calc(100vh - 76px);
  overflow:auto;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:14px 10px;
  border:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}
.card:active{
  transform:scale(.96);
}

.icon{
  font-size:22px;
}
.card span{
  font-size:11px;
  font-weight:700;
  line-height:1.2;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}
.popup iframe{
  width:100%;
  height:100%;
  border:none;
}
.close{
  position:fixed;
  top:14px;
  right:14px;
  z-index:10000;
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  font-weight:800;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Painel Admin</h1>
    <p>Controle do sistema</p>
  </div>

  <div class="notify" onclick="abrirNotificacoes()">
    🔔
    <div class="badge" id="badge">3</div>
  </div>
</div>

<!-- GRID -->
<div class="grid">

  <div class="card" onclick="abrir('parcerias.html')">
    <div class="icon">🤝</div>
    <span>Parcerias</span>
  </div>

  <div class="card" onclick="abrir('excursões.html')">
    <div class="icon">🚌</div>
    <span>Excursões</span>
  </div>

  <div class="card">
    <div class="icon">🖼️</div>
    <span>Banners</span>
  </div>

  <div class="card">
    <div class="icon">⚙️</div>
    <span>Config</span>
  </div>

  <div class="card">
    <div class="icon">👥</div>
    <span>Usuários</span>
  </div>

  <div class="card">
    <div class="icon">📊</div>
    <span>Relatórios</span>
  </div>

  <div class="card">
    <div class="icon">💳</div>
    <span>Pagamentos</span>
  </div>

  <div class="card">
    <div class="icon">📍</div>
    <span>Locais</span>
  </div>

  <div class="card">
    <div class="icon">📨</div>
    <span>Mensagens</span>
  </div>

  <div class="card">
    <div class="icon">🧩</div>
    <span>Módulos</span>
  </div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="close" onclick="fechar()">✕</div>
  <iframe id="frame"></iframe>
</div>

<script>
/* ================= SUPABASE ================= */
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

/* 🔐 PROTEÇÃO DE ACESSO */
(async()=>{
  const { data:{session} } = await sb.auth.getSession();
  if(!session){
    location.replace("login.html");
  }
})();

/* POPUP */
function abrir(url){
  frame.src = url;
  popup.style.display = "block";
}
function fechar(){
  frame.src = "";
  popup.style.display = "none";
}
function abrirNotificacoes(){
  abrir("notificacoes.html");
}

/* PWA */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
