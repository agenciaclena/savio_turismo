<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Parcerias</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --muted:#6b7280;
  --danger:#dc2626;
}

html,body{
  height:100%;
  background:#f4f6fb;
  overflow:hidden;
}

.page{
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  padding:18px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

.form{
  padding:16px;
  display:grid;
  gap:12px;
  border-bottom:1px solid var(--border);
}

label{
  font-size:12px;
  font-weight:700;
}

input{
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 14px;
}

.image-box{
  height:160px;
  border-radius:18px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

button{
  height:48px;
  border-radius:999px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.lista{
  flex:1;
  overflow:auto;
  padding:16px;
  display:grid;
  gap:12px;
}

.item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.item img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup-box{
  background:#fff;
  width:90%;
  max-width:320px;
  border-radius:20px;
  padding:18px;
  display:grid;
  gap:12px;
}

.popup-actions{
  display:flex;
  gap:10px;
}

.popup-actions button{flex:1}
.delete{background:var(--danger)}
</style>
</head>

<body>

<div class="page">

  <div class="header">Parcerias</div>

  <div class="form">

    <label>Logo</label>
    <div class="image-box" onclick="logo.click()">
      <img id="preview" style="display:none">
      <input type="file" id="logo" hidden accept="image/*">
    </div>

    <label>Nome</label>
    <input id="nome">

    <label>Link</label>
    <input id="link" type="url">

    <button onclick="salvar()">Salvar parceria</button>
  </div>

  <div class="lista" id="lista"></div>

</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <strong>Editar parceria</strong>
    <input id="edit_nome">
    <input id="edit_link">

    <div class="popup-actions">
      <button onclick="atualizar()">Salvar</button>
      <button class="delete" onclick="excluir()">Excluir</button>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId;
let file = null;
let editId = null;

(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    location.href="login.html";
    return;
  }
  userId = session.user.id;
  carregar();
})();

logo.onchange = () => {
  file = logo.files[0];
  if(!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display="block";
};

async function salvar(){
  if(!file){
    alert("Selecione a logo");
    return;
  }

  const path = `${userId}/${Date.now()}-${file.name}`;

  const { error:uploadError } = await sb
    .storage
    .from("buffet_parcerias")
    .upload(path, file, { upsert:true });

  if(uploadError){
    console.error(uploadError);
    alert("Erro ao enviar imagem");
    return;
  }

  const { error } = await sb.from("parcerias").insert({
    user_id:userId,
    nome:nome.value,
    link:link.value,
    logo_url:path,
    ativo:true
  });

  if(error){
    console.error(error);
    alert("Erro ao salvar parceria");
    return;
  }

  nome.value="";
  link.value="";
  preview.style.display="none";
  file=null;

  carregar();
}

async function carregar(){
  const { data } = await sb
    .from("parcerias")
    .select("*")
    .eq("user_id",userId)
    .order("created_at",{ascending:false});

  lista.innerHTML="";

  data.forEach(p=>{
    const img = sb.storage
      .from("buffet_parcerias")
      .getPublicUrl(p.logo_url).data.publicUrl;

    const div = document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <img src="${img}">
      <strong>${p.nome}</strong>
    `;

    div.onclick=()=>window.open(p.link,"_blank");
    div.ondblclick=()=>{
      editId=p.id;
      edit_nome.value=p.nome;
      edit_link.value=p.link;
      popup.style.display="flex";
    };

    lista.appendChild(div);
  });
}

async function atualizar(){
  await sb.from("parcerias").update({
    nome:edit_nome.value,
    link:edit_link.value
  }).eq("id",editId);

  popup.style.display="none";
  carregar();
}

async function excluir(){
  if(!confirm("Excluir parceria?")) return;
  await sb.from("parcerias").delete().eq("id",editId);
  popup.style.display="none";
  carregar();
}
</script>

</body>
</html>
