<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Parcerias</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
html,body{height:100%;background:#f4f6fb;overflow:hidden}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --danger:#dc2626;
  --card:#fff;
}

/* ===== LAYOUT ===== */
.page{height:100%;display:flex;flex-direction:column}

/* HEADER */
.header{
  padding:16px;
  font-size:18px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

/* FORM */
.form{
  padding:16px;
  display:grid;
  gap:12px;
  border-bottom:1px solid var(--border);
}
label{font-size:12px;font-weight:700}
input{
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 14px;
}
.image-box{
  height:150px;
  border-radius:18px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}
button{
  height:48px;
  border-radius:999px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:900;
}

/* ===== GRID PARCERIAS ===== */
.lista{
  flex:1;
  overflow:auto;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(5,1fr); /* 🔥 5 POR LINHA */
  gap:14px;
}
.item{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  user-select:none;
}
.item img{
  width:72px;
  height:72px;
  object-fit:contain;
}
.item span{
  font-size:12px;
  font-weight:800;
  text-align:center;
}

/* ===== POPUP ===== */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup-box{
  background:#fff;
  width:92%;
  max-width:340px;
  border-radius:20px;
  padding:16px;
  display:grid;
  gap:12px;
}
.popup-box strong{font-size:14px}
.popup-actions{display:flex;gap:10px}
.popup-actions button{flex:1}
.delete{background:var(--danger)}
.cancel{background:#e5e7eb;color:#000}
</style>
</head>

<body>

<div class="page">

  <div class="header">Parcerias</div>

  <!-- FORM NOVA -->
  <div class="form">
    <label>Logo</label>
    <div class="image-box" onclick="logo.click()">
      <img id="preview" style="display:none">
      <input type="file" id="logo" hidden accept="image/*">
    </div>

    <label>Nome</label>
    <input id="nome">

    <label>Link (informativo)</label>
    <input id="link">

    <button onclick="salvar()">Salvar parceria</button>
  </div>

  <!-- LISTA -->
  <div class="lista" id="lista"></div>
</div>

<!-- POPUP EDITAR -->
<div class="popup" id="popup">
  <div class="popup-box">
    <strong>Editar parceria</strong>

    <div class="image-box" onclick="edit_logo.click()">
      <img id="edit_preview">
      <input type="file" id="edit_logo" hidden accept="image/*">
    </div>

    <input id="edit_nome">
    <input id="edit_link">

    <div class="popup-actions">
      <button onclick="atualizar()">Salvar</button>
      <button class="delete" onclick="excluir()">Excluir</button>
    </div>

    <button class="cancel" onclick="fecharPopup()">Cancelar</button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId, file=null, editFile=null, editId=null;

(async()=>{
  const { data:{session} } = await sb.auth.getSession();
  if(!session) location.href="login.html";
  userId = session.user.id;
  carregar();
})();

logo.onchange = () =>{
  file = logo.files[0];
  preview.src = URL.createObjectURL(file);
  preview.style.display="block";
};

edit_logo.onchange = ()=>{
  editFile = edit_logo.files[0];
  edit_preview.src = URL.createObjectURL(editFile);
};

async function salvar(){
  if(!file) return alert("Selecione a logo");
  const path = `${userId}/${Date.now()}.png`;
  await sb.storage.from("buffet_parcerias").upload(path,file,{upsert:true});
  await sb.from("parcerias").insert({
    user_id:userId,nome:nome.value,link:link.value,logo_url:path
  });
  nome.value="";link.value="";preview.style.display="none";file=null;
  carregar();
}

async function carregar(){
  const { data } = await sb.from("parcerias")
    .select("*").eq("user_id",userId).order("created_at",{ascending:false});
  lista.innerHTML="";
  data.forEach(p=>{
    const img = sb.storage.from("buffet_parcerias")
      .getPublicUrl(p.logo_url).data.publicUrl;
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML=`<img src="${img}"><span>${p.nome}</span>`;
    div.ondblclick=()=>{
      editId=p.id;
      edit_nome.value=p.nome;
      edit_link.value=p.link||"";
      edit_preview.src=img;
      popup.style.display="flex";
    };
    lista.appendChild(div);
  });
}

function fecharPopup(){popup.style.display="none";editFile=null;}

async function atualizar(){
  let logoUrl;
  if(editFile){
    logoUrl = `${userId}/${Date.now()}.png`;
    await sb.storage.from("buffet_parcerias").upload(logoUrl,editFile,{upsert:true});
  }
  await sb.from("parcerias").update({
    nome:edit_nome.value,
    link:edit_link.value,
    ...(logoUrl && {logo_url:logoUrl})
  }).eq("id",editId);
  fecharPopup();carregar();
}

async function excluir(){
  if(!confirm("Excluir parceria?"))return;
  await sb.from("parcerias").delete().eq("id",editId);
  fecharPopup();carregar();
}
</script>

</body>
</html>
