<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Parcerias</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
}

body{
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:flex-end;
  height:100vh;
}

.modal{
  background:#fff;
  width:100%;
  height:92vh;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}

.header{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.body{
  flex:1;
  overflow:auto;
  padding:20px;
  display:grid;
  gap:14px;
}

label{
  font-size:12px;
  font-weight:700;
}

input{
  height:44px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 14px;
}

.image-box{
  height:220px;
  border-radius:18px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border:1px solid var(--border);
  border-radius:14px;
  font-weight:700;
}

.toggle input{display:none}

.switch{
  width:38px;
  height:22px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
}

.switch::after{
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:.2s;
}

.toggle input:checked + .switch{
  background:var(--primary);
}

.toggle input:checked + .switch::after{
  left:18px;
}

.footer{
  padding:16px;
  display:flex;
  gap:12px;
  border-top:1px solid var(--border);
}

button{
  flex:1;
  height:48px;
  border-radius:999px;
  border:none;
  font-weight:900;
  cursor:pointer;
}

.save{background:var(--primary);color:#fff}
.cancel{background:#e5e7eb}
</style>
</head>

<body>

<div class="modal">

  <div class="header">
    <span>Nova parceria</span>
    <span onclick="fechar()">✕</span>
  </div>

  <div class="body">

    <label>Logo da parceria</label>
    <div class="image-box" onclick="logo.click()">
      <img id="preview" style="display:none">
      <input type="file" id="logo" hidden accept="image/*">
    </div>

    <label>Nome</label>
    <input id="nome">

    <label>Link</label>
    <input id="link" placeholder="https://site-do-parceiro.com" type="url">

    <label class="toggle">
      <span>Ativo</span>
      <input type="checkbox" id="ativo" checked>
      <div class="switch"></div>
    </label>

  </div>

  <div class="footer">
    <button class="cancel" onclick="fechar()">Cancelar</button>
    <button class="save" onclick="salvar()">Salvar</button>
  </div>

</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId;
let file = null;

(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    alert("Faça login primeiro");
    return;
  }
  userId = session.user.id;
})();

logo.onchange = () => {
  file = logo.files[0];
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

function fechar(){
  window.parent.postMessage("fecharParcerias","*");
}

async function salvar(){
  if(!file){
    alert("Selecione a logo");
    return;
  }

  const path = `${userId}/${Date.now()}.png`;

  const { error:uploadError } = await sb.storage
    .from("buffet_parceirias")
    .upload(path, file, { upsert:true });

  if(uploadError){
    alert("Erro ao enviar imagem");
    return;
  }

  const payload = {
    user_id: userId,
    nome: nome.value || null,
    link: link.value || null,
    logo_url: path,
    ativo: ativo.checked
  };

  const { error } = await sb.from("parcerias").insert(payload);

  if(error){
    alert("Erro ao salvar");
    return;
  }

  alert("Parceria salva ✅");
  fechar();
}
</script>

</body>
</html>
