<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Parcerias</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

:root{
  --primary:#ff6a00;
  --border:#e5e7eb;
  --danger:#dc2626;
}

html,body{
  height:100%;
  background:#f4f6fb;
  overflow:hidden;
}

.page{
  height:100%;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  padding:14px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

/* FORM */
.form{
  padding:14px;
  display:grid;
  gap:10px;
  border-bottom:1px solid var(--border);
}

label{
  font-size:11px;
  font-weight:700;
}

input{
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  padding:0 12px;
}

.image-box{
  height:120px;
  border-radius:14px;
  background:#e5e7eb;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

button{
  height:44px;
  border-radius:999px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-weight:900;
}

/* GRID – 5 POR LINHA */
.lista{
  flex:1;
  overflow:auto;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

/* CARD */
.item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:8px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  text-align:center;
}

.item img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.item span{
  font-size:10px;
  font-weight:800;
  line-height:1.1;
}

/* SELEÇÃO */
.item.selected{
  outline:2px solid var(--primary);
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup-box{
  background:#fff;
  width:88%;
  max-width:300px;
  border-radius:18px;
  padding:16px;
  display:grid;
  gap:10px;
}

.popup-actions{
  display:flex;
  gap:8px;
}

.popup-actions button{flex:1}
.delete{background:var(--danger)}
.cancel{background:#e5e7eb;color:#000}
</style>
</head>

<body>

<div class="page">

  <div class="header">Parcerias</div>

  <div class="form">
    <label>Logo</label>
    <div class="image-box" onclick="logo.click()">
      <img id="preview" style="display:none">
      <input type="file" id="logo" hidden accept="image/*">
    </div>

    <label>Nome</label>
    <input id="nome">

    <label>Link (informativo)</label>
    <input id="link" type="url">

    <button onclick="salvar()">Salvar parceria</button>
  </div>

  <div class="lista" id="lista"></div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <strong>Editar parceria</strong>

    <input id="edit_nome">
    <input id="edit_link">

    <div class="popup-actions">
      <button onclick="atualizar()">Salvar</button>
      <button class="delete" onclick="excluir()">Excluir</button>
    </div>

    <button class="cancel" onclick="fecharPopup()">Cancelar</button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let userId, file=null, editId=null;
let lastTap = 0;
let selectedEl = null;

/* LOGIN */
(async()=>{
  const { data:{session} } = await sb.auth.getSession();
  if(!session){
    location.href="login.html";
    return;
  }
  userId=session.user.id;
  carregar();
})();

logo.onchange=()=>{
  file=logo.files[0];
  if(!file) return;
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
};

async function salvar(){
  if(!file) return alert("Selecione a logo");

  const path=`${userId}/${Date.now()}.png`;

  const { error:upErr } = await sb
    .storage
    .from("buffet_parcerias") /* ✅ NOME CORRETO */
    .upload(path,file,{upsert:true});

  if(upErr) return alert(upErr.message);

  await sb.from("parcerias").insert({
    user_id:userId,
    nome:nome.value,
    link:link.value,
    logo_url:path,
    ativo:true
  });

  nome.value=""; link.value="";
  preview.style.display="none"; file=null;
  carregar();
}

async function carregar(){
  const { data } = await sb
    .from("parcerias")
    .select("*")
    .eq("user_id",userId)
    .order("created_at",{ascending:false});

  lista.innerHTML="";

  data.forEach(p=>{
    const img = sb.storage
      .from("buffet_parcerias")
      .getPublicUrl(p.logo_url).data.publicUrl;

    const el=document.createElement("div");
    el.className="item";
    el.innerHTML=`<img src="${img}"><span>${p.nome}</span>`;

    el.onclick=()=>{
      const now=Date.now();
      if(now-lastTap<400 && selectedEl===el){
        abrirEdicao(p);
      }else{
        document.querySelectorAll(".item").forEach(i=>i.classList.remove("selected"));
        el.classList.add("selected");
        selectedEl=el;
      }
      lastTap=now;
    };

    lista.appendChild(el);
  });
}

function abrirEdicao(p){
  editId=p.id;
  edit_nome.value=p.nome;
  edit_link.value=p.link||"";
  popup.style.display="flex";
}

function fecharPopup(){
  popup.style.display="none";
}

async function atualizar(){
  await sb.from("parcerias").update({
    nome:edit_nome.value,
    link:edit_link.value
  }).eq("id",editId);
  fecharPopup(); carregar();
}

async function excluir(){
  if(!confirm("Excluir parceria?")) return;
  await sb.from("parcerias").delete().eq("id",editId);
  fecharPopup(); carregar();
}
</script>

</body>
</html>
