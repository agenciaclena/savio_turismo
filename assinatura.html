<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • ASSINATURA</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:#f4f6f8;color:#111}
header{
  background:#fff;
  padding:16px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid #e5e7eb
}
header img{height:55px}
.container{max-width:900px;margin:auto;padding:20px}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 24px rgba(0,0,0,.06)
}
.card h2{
  margin:0 0 12px;
  font-size:15px;
  border-bottom:1px solid #eee;
  padding-bottom:8px
}
canvas{
  width:100%;
  height:220px;
  border:2px dashed #d1d5db;
  border-radius:14px;
  touch-action:none;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px
}
.btn{
  padding:15px;
  border:none;
  border-radius:999px;
  font-size:15px;
  font-weight:800;
  cursor:pointer
}
.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff
}
.btn-secondary{
  background:#e5e7eb;
  color:#111
}
.info{
  font-size:13px;
  color:#6b7280;
  margin-bottom:12px
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">

<div class="card">
<h2>ASSINATURA DO CONTRATANTE</h2>

<p class="info">
ASSINE NO CAMPO ABAIXO USANDO O DEDO OU MOUSE.  
ESSA ASSINATURA TERÁ VALIDADE LEGAL NO CONTRATO.
</p>

<canvas id="assinatura"></canvas>

<div class="actions">
  <button class="btn btn-secondary" onclick="limpar()">LIMPAR ASSINATURA</button>
  <button class="btn btn-primary" onclick="confirmar()">CONFIRMAR ASSINATURA</button>
</div>

</div>

</div>

<script>
/* ========= CANVAS ========= */
const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");
let desenhando = false;

function ajustarCanvas(){
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
}

ajustarCanvas();
window.addEventListener("resize", ajustarCanvas);

/* ========= DESENHO ========= */
function pos(e){
  if(e.touches) return {
    x: e.touches[0].clientX - canvas.getBoundingClientRect().left,
    y: e.touches[0].clientY - canvas.getBoundingClientRect().top
  };
  return {
    x: e.offsetX,
    y: e.offsetY
  };
}

canvas.addEventListener("mousedown", e=>{
  desenhando = true;
  const p = pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("mousemove", e=>{
  if(!desenhando) return;
  const p = pos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>desenhando=false);
canvas.addEventListener("mouseleave", ()=>desenhando=false);

canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  desenhando = true;
  const p = pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(!desenhando) return;
  const p = pos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
},{passive:false});

canvas.addEventListener("touchend", ()=>desenhando=false);

/* ========= STORAGE ========= */
const SIGN_KEY = "assinatura_base64";

/* RESTAURAR SE EXISTIR */
const salvo = localStorage.getItem(SIGN_KEY);
if(salvo){
  const img = new Image();
  img.onload = ()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);
  img.src = salvo;
}

/* ========= AÇÕES ========= */
function limpar(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  localStorage.removeItem(SIGN_KEY);
}

function confirmar(){
  const data = canvas.toDataURL("image/png");
  // Verifica se está vazio
  const vazio = ctx.getImageData(0,0,canvas.width,canvas.height).data
    .every(v=>v===0);
  if(vazio){
    alert("ASSINATURA OBRIGATÓRIA");
    return;
  }

  localStorage.setItem(SIGN_KEY, data);
  location.href = "contrato.html";
}
</script>

</body>
</html>
