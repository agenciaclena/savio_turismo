<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • ASSINATURA</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#ff6a00;
  --bg:#f4f6f8;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111;
}

*{
  box-sizing:border-box;
  font-family:Inter;
  text-transform:uppercase;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden; /* IMPEDE ZOOM E SCROLL INDESEJADO */
  background:var(--bg);
  color:var(--text);
}

header{
  background:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid var(--border);
}

header img{
  height:52px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
  height:calc(100vh - 80px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:100%;
  max-width:520px;
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
}

.card h2{
  margin:0 0 10px;
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
  text-align:center;
}

.info{
  font-size:12px;
  color:#6b7280;
  text-align:center;
  margin-bottom:12px;
}

/* ===== CANVAS ===== */
.canvas-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

canvas{
  width:100%;
  height:240px;
  border:2px dashed #d1d5db;
  border-radius:16px;
  background:#fafafa;
  touch-action:none; /* ESSENCIAL PARA NÃO DAR ZOOM */
}

/* ===== BOTÕES ===== */
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}

.btn{
  padding:16px;
  border:none;
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111;
}

/* ===== MOBILE EXTRA ===== */
@media(max-width:480px){
  canvas{
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">
  <div class="card">

    <h2>ASSINATURA DO CONTRATANTE</h2>

    <p class="info">
      ASSINE NO CAMPO ABAIXO USANDO O DEDO OU MOUSE.<br>
      ESTA ASSINATURA POSSUI VALIDADE LEGAL.
    </p>

    <div class="canvas-wrap">
      <canvas id="assinatura"></canvas>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="limpar()">LIMPAR</button>
      <button class="btn btn-primary" onclick="confirmar()">CONFIRMAR</button>
    </div>

  </div>
</div>

<script>
/* ========= CANVAS ========= */
const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");
let desenhando = false;

function ajustarCanvas(){
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
}

ajustarCanvas();
window.addEventListener("resize", ajustarCanvas);

/* ========= POSIÇÃO ========= */
function pos(e){
  const rect = canvas.getBoundingClientRect();
  if(e.touches){
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }
  return { x:e.offsetX, y:e.offsetY };
}

/* ========= DESENHO ========= */
canvas.addEventListener("mousedown", e=>{
  desenhando=true;
  const p=pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
});

canvas.addEventListener("mousemove", e=>{
  if(!desenhando) return;
  const p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
});

canvas.addEventListener("mouseup", ()=>desenhando=false);
canvas.addEventListener("mouseleave", ()=>desenhando=false);

canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  desenhando=true;
  const p=pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(!desenhando) return;
  const p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
},{passive:false});

canvas.addEventListener("touchend", ()=>desenhando=false);

/* ========= STORAGE ========= */
const SIGN_KEY = "assinatura_base64";

/* RESTAURA SE EXISTIR */
const salvo = localStorage.getItem(SIGN_KEY);
if(salvo){
  const img = new Image();
  img.onload = ()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);
  img.src = salvo;
}

/* ========= AÇÕES ========= */
function limpar(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  localStorage.removeItem(SIGN_KEY);
}

function confirmar(){
  const vazio = ctx.getImageData(0,0,canvas.width,canvas.height).data
    .every(v=>v===0);

  if(vazio){
    alert("ASSINATURA OBRIGATÓRIA");
    return;
  }

  const data = canvas.toDataURL("image/png");
  localStorage.setItem(SIGN_KEY, data);
  location.href = "contrato.html";
}
</script>

</body>
</html>
