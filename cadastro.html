<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CONTRATO DIGITAL</title>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#ff6a00;
  --bg:#f4f6f8;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
  font-family:Inter;
  text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  -webkit-text-size-adjust:100%;
}

header{
  background:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid var(--border);
}

header img{height:50px}

.step{
  display:none;
  padding:16px 16px 140px;
}

.step.active{display:block}

.card{
  max-width:900px;
  margin:0 auto 16px;
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
}

h2{
  margin:0 0 14px;
  font-size:15px;
  font-weight:800;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

/* ===== PACOTE ===== */
.pacote{
  max-width:900px;
  margin:0 auto 16px;
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
}
.pacote img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.pacote-body{
  padding:14px;
}
.pacote-body h3{
  margin:0 0 6px;
  font-size:16px;
  font-weight:900;
}
.pacote-body p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}
.pacote-body strong{
  display:block;
  margin-top:6px;
  font-size:18px;
  color:var(--primary);
}

/* ===== INPUTS ===== */
label{
  font-size:11px;
  font-weight:800;
  display:block;
  margin-top:12px;
}

input{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:14px;
  border:1px solid #d1d5db;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:var(--primary);
}

/* ===== FLEGS ===== */
.fleg{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
}

.fleg span{
  font-size:13px;
  font-weight:800;
}

.fleg input{display:none}

.toggle{
  width:52px;
  height:28px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
  transition:.25s;
}

.toggle::after{
  content:"";
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.25s;
}

.fleg input:checked + .toggle{
  background:var(--primary);
}

.fleg input:checked + .toggle::after{
  transform:translateX(24px);
}

/* ===== CANVAS ===== */
canvas{
  width:100%;
  height:240px;
  border:2px dashed #d1d5db;
  border-radius:16px;
  background:#fafafa;
  touch-action:none;
}

/* ===== BOTÃO ===== */
.actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--border);
  padding:14px;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
</style>
</head>

<body>

<header>
  <img src="logo.png">
</header>

<!-- ================= STEP 1 : CADASTRO ================= -->
<div class="step active" id="stepCadastro">

  <div class="pacote" id="boxPacote">
    <img id="pFoto">
    <div class="pacote-body">
      <h3 id="pTitulo"></h3>
      <p id="pDatas"></p>
      <strong id="pValor"></strong>
    </div>
  </div>

  <div class="card">
    <h2>DADOS DO CONTRATANTE</h2>

    <label>NOME COMPLETO</label>
    <input id="nome">

    <label>CPF</label>
    <input id="cpf">

    <label>RG</label>
    <input id="rg">

    <label>DATA DE NASCIMENTO</label>
    <input type="date" id="nascimento">

    <label>WHATSAPP</label>
    <input id="telefone">

    <label>E-MAIL</label>
    <input id="email" style="text-transform:none">

    <button class="btn" onclick="irContrato()">CONTINUAR</button>
  </div>
</div>

<!-- ================= STEP 2 : CONTRATO ================= -->
<div class="step" id="stepContrato">

  <div class="card">
    <h2>CONTRATO DE PRESTAÇÃO DE SERVIÇOS TURÍSTICOS</h2>

    <p>
      EU, <strong id="cNome"></strong>, CPF <strong id="cCpf"></strong>,
      DECLARO QUE LI, COMPREENDI E CONCORDO COM TODOS OS TERMOS
      REFERENTES AO PACOTE <strong id="cPacote"></strong>.
    </p>

    <div class="fleg">
      <span>ACEITO O CONTRATO</span>
      <input type="checkbox" id="f1">
      <div class="toggle"></div>
    </div>

    <div class="fleg">
      <span>CIÊNCIA DOS RISCOS</span>
      <input type="checkbox" id="f2">
      <div class="toggle"></div>
    </div>

    <div class="fleg">
      <span>AUTORIZO LGPD</span>
      <input type="checkbox" id="f3">
      <div class="toggle"></div>
    </div>

    <button class="btn" onclick="irAssinatura()">IR PARA ASSINATURA</button>
  </div>
</div>

<!-- ================= STEP 3 : ASSINATURA ================= -->
<div class="step" id="stepAssinatura">

  <div class="card">
    <h2>ASSINATURA DO CONTRATANTE</h2>

    <canvas id="canvas"></canvas>

    <button class="btn" onclick="finalizar()">FINALIZAR</button>
  </div>
</div>

<script>
/* ===== PACOTE ===== */
const pacote = JSON.parse(localStorage.getItem("pacoteSelecionado")||"{}");
if(pacote){
  pFoto.src = pacote.foto || "";
  pTitulo.innerText = pacote.titulo || "";
  pDatas.innerText = pacote.datas || "";
  pValor.innerText = pacote.valor || "";
}

/* ===== NAVEGAÇÃO ===== */
function show(id){
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ===== CADASTRO → CONTRATO ===== */
function irContrato(){
  if(!nome.value || !cpf.value) return alert("PREENCHA OS DADOS");
  cNome.innerText = nome.value;
  cCpf.innerText = cpf.value;
  cPacote.innerText = pacote.titulo || "";
  show("stepContrato");
}

/* ===== CONTRATO → ASSINATURA ===== */
function irAssinatura(){
  if(!f1.checked || !f2.checked || !f3.checked){
    alert("ACEITE TODAS AS DECLARAÇÕES");
    return;
  }
  show("stepAssinatura");
}

/* ===== CANVAS ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let draw=false;

function resize(){
  const r=window.devicePixelRatio||1;
  canvas.width=canvas.offsetWidth*r;
  canvas.height=canvas.offsetHeight*r;
  ctx.setTransform(r,0,0,r,0,0);
  ctx.lineWidth=2.5;
  ctx.lineCap="round";
}
resize();
window.addEventListener("resize",resize);

canvas.addEventListener("mousedown",e=>{
  draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);
});
canvas.addEventListener("mousemove",e=>{
  if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}
});
canvas.addEventListener("mouseup",()=>draw=false);
canvas.addEventListener("mouseleave",()=>draw=false);

canvas.addEventListener("touchstart",e=>{
  e.preventDefault();draw=true;
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  ctx.beginPath();ctx.moveTo(t.clientX-r.left,t.clientY-r.top);
},{passive:false});

canvas.addEventListener("touchmove",e=>{
  e.preventDefault();if(!draw)return;
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  ctx.lineTo(t.clientX-r.left,t.clientY-r.top);ctx.stroke();
},{passive:false});

canvas.addEventListener("touchend",()=>draw=false);

/* ===== FINAL ===== */
function finalizar(){
  const vazio = ctx.getImageData(0,0,canvas.width,canvas.height).data.every(v=>v===0);
  if(vazio){alert("ASSINATURA OBRIGATÓRIA");return;}
  const assinatura = canvas.toDataURL("image/png");
  console.log({
    pacote,
    cadastro:{
      nome:nome.value,
      cpf:cpf.value,
      rg:rg.value,
      nascimento:nascimento.value,
      telefone:telefone.value,
      email:email.value
    },
    assinatura
  });
  alert("FLUXO FINALIZADO. PRONTO PARA PDF / SUPABASE.");
}
</script>

</body>
</html>
