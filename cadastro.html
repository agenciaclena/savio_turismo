<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:#f4f6f8;color:#111}
header{
  background:#fff;
  padding:16px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid #e5e7eb
}
header img{height:60px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 24px rgba(0,0,0,.06)
}
.card h2{
  margin:0 0 12px;
  font-size:15px;
  border-bottom:1px solid #eee;
  padding-bottom:8px
}
label{font-size:12px;font-weight:700}
input,select{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin:6px 0 12px;
  font-size:14px
}
input:focus{outline:none;border-color:#ff6a00}
.readonly{background:#f1f1f1}
.checks label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin-bottom:10px
}
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer
}
button:hover{opacity:.9}
</style>
</head>

<input required>

<input>

</div>

</div>

<button type="submit">CONFIRMAR DADOS</button>

</form>
</div>
