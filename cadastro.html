<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#ff6a00; --bg:#f4f6f8; --card:#fff; --border:#e5e7eb; --text:#111;
}
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:var(--bg);color:var(--text)}
header{background:#fff;padding:14px;display:flex;justify-content:center;border-bottom:1px solid var(--border)}
header img{height:54px}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:800;border-bottom:1px solid var(--border);padding-bottom:8px}
label{font-size:12px;font-weight:700;margin-top:10px;display:block}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #d1d5db;margin-top:6px;font-size:16px}
.readonly{background:#f1f1f1}

/* Switch */
.switch-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.switch-row span{font-size:13px;font-weight:800}
.switch-row input{display:none}
.switch-ui{width:48px;height:28px;background:#d1d5db;border-radius:999px;position:relative}
.switch-ui::after{content:"";width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.25s}
.switch-row input:checked + .switch-ui{background:var(--primary)}
.switch-row input:checked + .switch-ui::after{transform:translateX(20px)}

.actions{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.btn{padding:18px;border:none;border-radius:999px;font-weight:800}
.btn-primary{background:linear-gradient(135deg,#ff6a00,#ff9a57);color:#fff}
</style>
</head>

<body>
<header><img src="logo.png"></header>

<div class="container">
<form id="formCadastro">
<div class="grid">

<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>
<label>NOME</label><input id="nome" required>
<label>CPF</label><input id="cpf" required>
<label>RG</label><input id="rg" required>
<label>NASCIMENTO</label><input id="nascimento" type="date" required>
<label>PROFISSÃO</label><input id="profissao">
<label>TELEFONE</label><input id="telefone" required>
<label>E-MAIL</label><input id="email" type="email" style="text-transform:none" required>
</div>

<div class="card">
<h2>ENDEREÇO</h2>
<label>CEP</label><input id="cep" required>
<label>RUA</label><input id="rua" class="readonly" readonly>
<label>NÚMERO</label><input id="numero" required>
<label>BAIRRO</label><input id="bairro" class="readonly" readonly>
<label>CIDADE</label><input id="cidade" class="readonly" readonly>
<label>UF</label><input id="uf" class="readonly" readonly>
</div>

<div class="card">
<h2>EMERGÊNCIA & DECLARAÇÕES</h2>
<label>NOME</label><input id="em_nome" required>
<label>PARENTESCO</label><input id="em_parentesco" required>
<label>TELEFONE</label><input id="em_telefone" required>

<label class="switch-row" for="aceite_contrato">
  <span>ACEITO O CONTRATO</span>
  <input type="checkbox" id="aceite_contrato">
  <div class="switch-ui"></div>
</label>

<label class="switch-row" for="aceite_risco">
  <span>CIÊNCIA DOS RISCOS</span>
  <input type="checkbox" id="aceite_risco">
  <div class="switch-ui"></div>
</label>

<label class="switch-row" for="aceite_lgpd">
  <span>AUTORIZO LGPD</span>
  <input type="checkbox" id="aceite_lgpd">
  <div class="switch-ui"></div>
</label>
</div>

</div>

<div class="actions">
<button class="btn btn-primary">CONFIRMAR</button>
</div>
</form>
</div>

<script>
const $ = id => document.getElementById(id);

/* Restaurar */
const salvo = JSON.parse(localStorage.getItem("cadastro_savio")||"{}");
Object.keys(salvo).forEach(k=>{
  if($(k)) $(k).type==="checkbox" ? $(k).checked=salvo[k] : $(k).value=salvo[k];
});

/* CEP */
$("cep").addEventListener("blur", async ()=>{
  const c=$("cep").value.replace(/\D/g,"");
  if(c.length!==8) return;
  const r=await fetch(`https://viacep.com.br/ws/${c}/json/`).then(r=>r.json());
  if(r.erro) return alert("CEP não encontrado");
  $("rua").value=r.logradouro; $("bairro").value=r.bairro;
  $("cidade").value=r.localidade; $("uf").value=r.uf;
});

/* Submit */
$("formCadastro").addEventListener("submit",e=>{
  e.preventDefault();
  if(!$("aceite_contrato").checked||!$("aceite_risco").checked||!$("aceite_lgpd").checked){
    alert("Aceite todas as declarações"); return;
  }
  const dados={};
  ["nome","cpf","rg","nascimento","profissao","telefone","email",
   "cep","rua","numero","bairro","cidade","uf",
   "em_nome","em_parentesco","em_telefone",
   "aceite_contrato","aceite_risco","aceite_lgpd"]
  .forEach(k=>dados[k]=$(k).type==="checkbox"?$(k).checked:$(k).value);

  localStorage.setItem("cadastro_savio",JSON.stringify(dados));
  location.href="resumo.html";
});
</script>
</body>
</html>
