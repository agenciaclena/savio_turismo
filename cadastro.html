<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --primary:#ff6a00;
  --bg:#f3f4f6;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
  font-family:Inter;
  text-transform:uppercase;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  background:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid var(--border);
}
header img{height:54px}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

/* PACOTE */
.pacote{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}
.pacote h1{margin:0;font-size:20px;font-weight:900}
.pacote p{margin:6px 0;font-size:13px}
.pacote .valor{
  margin-top:10px;
  font-size:22px;
  font-weight:900;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1200px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}
.card h2{
  margin:0 0 12px;
  font-size:14px;
  font-weight:900;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

/* INPUTS */
label{
  font-size:11px;
  font-weight:800;
  margin-top:10px;
  display:block;
  color:#374151;
}
input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #d1d5db;
  margin-top:6px;
  font-size:15px;
}
input:focus{
  outline:none;
  border-color:var(--primary);
}
.readonly{
  background:#f1f5f9;
}

/* SWITCH */
.switch{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:14px;
}
.switch span{
  font-size:13px;
  font-weight:800;
}
.switch input{display:none}
.switch-ui{
  width:48px;
  height:28px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
}
.switch-ui::after{
  content:"";
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.25s;
}
.switch input:checked + .switch-ui{
  background:var(--primary);
}
.switch input:checked + .switch-ui::after{
  transform:translateX(20px);
}

/* ACTIONS */
.actions{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
  font-size:15px;
}
.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
.btn-secondary{
  background:#e5e7eb;
}
#btnAssinar{display:none}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.modal.show{display:flex}
.modal-box{
  background:#fff;
  border-radius:18px;
  padding:20px;
  width:340px;
}
canvas{
  width:100%;
  height:140px;
  border:1px solid #000;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">

<!-- PACOTE -->
<div class="pacote" id="pacoteBox"></div>

<form id="formCadastro">
<div class="grid">

<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>
<label>NOME COMPLETO</label><input id="nome">
<label>CPF</label><input id="cpf">
<label>RG</label><input id="rg">
<label>DATA DE NASCIMENTO</label><input id="nascimento" type="date">
<label>PROFISSÃO</label><input id="profissao">
<label>WHATSAPP</label><input id="telefone">
<label>E-MAIL</label><input id="email" type="email" style="text-transform:none">
</div>

<div class="card">
<h2>ENDEREÇO</h2>
<label>CEP</label><input id="cep">
<label>RUA</label><input id="rua" class="readonly" readonly>
<label>NÚMERO</label><input id="numero">
<label>BAIRRO</label><input id="bairro" class="readonly" readonly>
<label>CIDADE</label><input id="cidade" class="readonly" readonly>
<label>UF</label><input id="uf" class="readonly" readonly>
</div>

<div class="card">
<h2>EMERGÊNCIA & ACEITES</h2>
<label>NOME</label><input id="em_nome">
<label>PARENTESCO</label><input id="em_parentesco">
<label>TELEFONE</label><input id="em_telefone">

<label class="switch" for="aceite_contrato">
  <span>ACEITO O CONTRATO</span>
  <input type="checkbox" id="aceite_contrato">
  <div class="switch-ui"></div>
</label>

<label class="switch" for="aceite_risco">
  <span>CIÊNCIA DOS RISCOS</span>
  <input type="checkbox" id="aceite_risco">
  <div class="switch-ui"></div>
</label>

<label class="switch" for="aceite_lgpd">
  <span>AUTORIZO LGPD</span>
  <input type="checkbox" id="aceite_lgpd">
  <div class="switch-ui"></div>
</label>

</div>

</div>

<div class="actions">
  <button type="button" id="btnAssinar" class="btn btn-primary">ASSINAR CONTRATO</button>
  <button type="button" class="btn btn-secondary" onclick="limparTudo()">LIMPAR TUDO</button>
</div>

</form>
</div>

<!-- MODAL ASSINATURA -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>ASSINE ABAIXO</h3>
    <canvas id="canvas" width="300" height="140"></canvas>
    <button class="btn btn-primary" onclick="finalizarContrato()">FINALIZAR CONTRATO</button>
  </div>
</div>
