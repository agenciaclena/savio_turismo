<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --primary:#ff6a00; --bg:#f4f6f8; --card:#fff; --border:#e5e7eb; --text:#111;
}
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:var(--bg);color:var(--text)}
header{background:#fff;padding:14px;display:flex;justify-content:center;border-bottom:1px solid var(--border)}
header img{height:54px}
.container{max-width:1200px;margin:auto;padding:16px}

.box{
  background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
}
.box h3{margin:0;font-size:16px;font-weight:900}
.box p{margin:4px 0;font-size:13px;color:#555}
.valor{font-size:18px;font-weight:900;color:#16a34a}

label{font-size:12px;font-weight:700;margin-top:10px;display:block}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #d1d5db;margin-top:6px;font-size:16px}
.readonly{background:#f1f1f1}

.switch{
  display:flex;justify-content:space-between;align-items:center;margin-top:14px;
}
.switch input{display:none}
.switch-ui{
  width:48px;height:28px;background:#d1d5db;border-radius:999px;position:relative
}
.switch-ui::after{
  content:"";width:22px;height:22px;background:#fff;border-radius:50%;
  position:absolute;top:3px;left:3px;transition:.25s
}
.switch input:checked + .switch-ui{background:var(--primary)}
.switch input:checked + .switch-ui::after{transform:translateX(20px)}

.btn{
  width:100%;padding:18px;border:none;border-radius:999px;
  font-weight:800;margin-top:16px;cursor:pointer
}
.btn-primary{background:linear-gradient(135deg,#ff6a00,#ff9a57);color:#fff}
.btn-clear{background:#e5e7eb}

#btnAssinar{display:none}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;z-index:9999
}
.modal.show{display:flex}
.modal-box{
  background:#fff;border-radius:18px;padding:20px;text-align:center;width:320px
}
canvas{border:1px solid #000;border-radius:8px}
</style>
</head>

<body>

<header>
  <img src="logo.png">
</header>

<div class="container">

<!-- PACOTE -->
<div class="box" id="boxPacote"></div>

<!-- FORM -->
<div class="box">
<label>NOME</label><input id="nome">
<label>CPF</label><input id="cpf">
<label>TELEFONE</label><input id="telefone">

<label class="switch">
  <span>ACEITO O CONTRATO</span>
  <input type="checkbox" id="aceite_contrato">
  <div class="switch-ui"></div>
</label>

<label class="switch">
  <span>CIÊNCIA DOS RISCOS</span>
  <input type="checkbox" id="aceite_risco">
  <div class="switch-ui"></div>
</label>

<label class="switch">
  <span>AUTORIZO LGPD</span>
  <input type="checkbox" id="aceite_lgpd">
  <div class="switch-ui"></div>
</label>

<button id="btnAssinar" class="btn btn-primary">ASSINAR CONTRATO</button>
<button class="btn btn-clear" onclick="limpar()">LIMPAR</button>
</div>

</div>

<!-- MODAL ASSINATURA -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>ASSINE ABAIXO</h3>
    <canvas id="canvas" width="260" height="120"></canvas>
    <button class="btn btn-primary" onclick="finalizar()">FINALIZAR</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ===== SUPABASE ===== */
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

/* ===== PACOTE ===== */
const params = new URLSearchParams(location.search);
const id = params.get("id");
let pacote = JSON.parse(localStorage.getItem("pacote")||"null");

(async()=>{
  if(!pacote && id){
    const {data} = await sb.from("excursoes").select("*").eq("id",id).single();
    pacote = data;
    localStorage.setItem("pacote",JSON.stringify(pacote));
  }
  if(pacote){
    boxPacote.innerHTML = `
      <h3>${pacote.titulo}</h3>
      <p>${pacote.destino}</p>
      <p>${pacote.data_saida} → ${pacote.data_retorno}</p>
      <div class="valor">R$ ${pacote.valor}</div>
    `;
  }
})();

/* ===== AUTO SAVE ===== */
["nome","cpf","telefone","aceite_contrato","aceite_risco","aceite_lgpd"].forEach(id=>{
  const el=$(id);
  el.oninput=el.onchange=()=>{
    const dados={
      nome:nome.value,
      cpf:cpf.value,
      telefone:telefone.value,
      aceite_contrato:aceite_contrato.checked,
      aceite_risco:aceite_risco.checked,
      aceite_lgpd:aceite_lgpd.checked
    };
    localStorage.setItem("cadastro_savio",JSON.stringify(dados));
    verificar();
  }
});

/* ===== RESTAURA ===== */
const salvo = JSON.parse(localStorage.getItem("cadastro_savio")||"{}");
Object.keys(salvo).forEach(k=>{
  if($(k)){
    $(k).type==="checkbox"?$(k).checked=salvo[k]:$(k).value=salvo[k];
  }
});

/* ===== BOTÃO ASSINAR ===== */
function verificar(){
  if(aceite_contrato.checked && aceite_risco.checked && aceite_lgpd.checked){
    btnAssinar.style.display="block";
  }else{
    btnAssinar.style.display="none";
  }
}
verificar();

/* ===== ASSINATURA ===== */
btnAssinar.onclick=()=>modal.classList.add("show");

const c=canvas,ctx=c.getContext("2d");
let d=false;
c.onmousedown=()=>d=true;
c.onmouseup=()=>d=false;
c.onmousemove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}};

async function finalizar(){
  const assinatura=c.toDataURL();
  localStorage.setItem("assinatura_base64",assinatura);

  const contrato=document.createElement("div");
  contrato.innerHTML=`<h2>CONTRATO</h2>
  <p>Eu ${nome.value}, CPF ${cpf.value}, aceito os termos.</p>
  <img src="${assinatura}" width="200">`;

  html2pdf().from(contrato).save("contrato.pdf");
}

/* ===== LIMPAR ===== */
function limpar(){
  if(confirm("LIMPAR TUDO?")){
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
