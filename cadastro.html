<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:#f4f6f8;color:#111}
header{
  background:#fff;
  padding:16px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid #e5e7eb
}
header img{height:60px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 24px rgba(0,0,0,.06)
}
.card h2{
  margin:0 0 12px;
  font-size:15px;
  border-bottom:1px solid #eee;
  padding-bottom:8px
}
label{font-size:12px;font-weight:700}
input{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin:6px 0 12px;
  font-size:14px
}
input:focus{outline:none;border-color:#ff6a00}
.readonly{background:#f1f1f1}
.checks label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin-bottom:10px
}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  font-size:16px;
  font-weight:800;
  cursor:pointer
}
.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
.btn-clear{
  background:#e5e7eb;
  color:#111;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">
<form id="formCadastro">

<div class="grid">

<!-- DADOS DO PASSAGEIRO -->
<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>

<label>NOME COMPLETO</label>
<input id="nome" required>

<label>CPF</label>
<input id="cpf" inputmode="numeric" required>

<label>RG</label>
<input id="rg" inputmode="numeric" required>

<label>DATA DE NASCIMENTO</label>
<input id="nascimento" type="date" required>

<label>PROFISSÃO</label>
<input id="profissao">

<label>WHATSAPP</label>
<input id="telefone" inputmode="numeric" required>

<label>E-MAIL</label>
<input id="email" type="email" style="text-transform:none" required>
</div>

<!-- ENDEREÇO -->
<div class="card">
<h2>ENDEREÇO</h2>

<label>CEP</label>
<input id="cep" inputmode="numeric" required>

<label>RUA</label>
<input id="rua" class="readonly" readonly>

<label>NÚMERO</label>
<input id="numero" inputmode="numeric" required>

<label>BAIRRO</label>
<input id="bairro" class="readonly" readonly>

<label>CIDADE</label>
<input id="cidade" class="readonly" readonly>

<label>UF</label>
<input id="uf" class="readonly" readonly>
</div>

<!-- CONTATO DE EMERGÊNCIA -->
<div class="card">
<h2>CONTATO DE EMERGÊNCIA</h2>

<label>NOME</label>
<input id="em_nome" required>

<label>PARENTESCO</label>
<input id="em_parentesco" required>

<label>TELEFONE</label>
<input id="em_telefone" inputmode="numeric" required>
</div>

<!-- SAÚDE -->
<div class="card">
<h2>INFORMAÇÕES DE SAÚDE (OPCIONAL)</h2>

<label>CONDIÇÃO DE SAÚDE</label>
<input id="saude_condicao">

<label>MEDICAMENTOS</label>
<input id="saude_medicamentos">

<label>ALERGIAS</label>
<input id="saude_alergias">

<label>TIPO SANGUÍNEO</label>
<input id="saude_sangue">
</div>

<!-- PACOTE -->
<div class="card">
<h2>PACOTE SELECIONADO</h2>

<label>PACOTE</label>
<input id="pacote_nome" class="readonly" readonly>

<label>PERÍODO</label>
<input id="pacote_periodo" class="readonly" readonly>

<label>VALOR</label>
<input id="pacote_valor" class="readonly" readonly>
</div>

<!-- ACEITES -->
<div class="card">
<h2>DECLARAÇÕES</h2>
<div class="checks">
<label><input type="checkbox" id="aceite_contrato" required> LI E ACEITO O CONTRATO</label>
<label><input type="checkbox" id="aceite_risco" required> CIÊNCIA DOS RISCOS</label>
<label><input type="checkbox" id="aceite_lgpd" required> AUTORIZO LGPD</label>
</div>
</div>

</div>

<button type="submit" class="btn btn-primary">CONFIRMAR DADOS</button>
<button type="button" class="btn btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>

</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ========= SUPABASE ========= */
const supabase = window.supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

/* ========= DADOS ========= */
const dados = JSON.parse(localStorage.getItem("cadastro_savio") || "{}");
const pacote = JSON.parse(localStorage.getItem("pacote") || "{}");
const assinatura = localStorage.getItem("assinatura_base64");

/* ========= HELPERS ========= */
function formatarData(d){
  if(!d) return "";
  const [y,m,da] = d.split("-");
  return `${da}/${m}/${y}`;
}

function mesAno(){
  const d = new Date();
  return {
    ano: d.getFullYear(),
    mes: String(d.getMonth()+1).padStart(2,"0")
  };
}

/* ========= PREENCHER CONTRATO ========= */
c_nome.innerText = dados.nome || "";
c_cpf.innerText = dados.cpf || "";
c_rg.innerText = dados.rg || "";

p_titulo.innerText = pacote.titulo || "";
p_saida.innerText = formatarData(pacote.data_saida);
p_retorno.innerText = formatarData(pacote.data_retorno);
p_valor.innerText = Number(pacote.valor)
  .toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

let inclusos = [];
if(pacote.inclui_transporte) inclusos.push("Transporte");
if(pacote.inclui_hospedagem) inclusos.push("Hospedagem");
if(pacote.inclui_cafe) inclusos.push("Café da manhã");
if(pacote.inclui_seguro) inclusos.push("Seguro viagem");
if(pacote.inclui_guia) inclusos.push("Guia turístico");
p_inclusos.innerText = inclusos.join(", ");

if(assinatura) assin_img.src = assinatura;

const agora = new Date();
local_data.innerText =
  `Assinado em ${agora.toLocaleDateString("pt-BR")} às ${agora.toLocaleTimeString("pt-BR")}`;

/* ========= GERAR PDF + UPLOAD ========= */
async function gerarEEnviarPDF(){

  const el = document.getElementById("contrato");

  const opt = {
    margin:10,
    html2canvas:{ scale:2 },
    jsPDF:{ unit:"mm", format:"a4", orientation:"portrait" }
  };

  // GERA PDF EM MEMÓRIA
  const pdfBlob = await html2pdf().set(opt).from(el).outputPdf("blob");

  const { ano, mes } = mesAno();
  const cpfLimpo = (dados.cpf || "SEMCPF").replace(/\D/g,"");
  const nomeArquivo =
    `CONTRATO_${pacote.id}_${cpfLimpo}_${Date.now()}.pdf`;

  const caminho = `${ano}/${mes}/${nomeArquivo}`;

  // UPLOAD
  const { error } = await supabase
    .storage
    .from("buffet_contratos")
    .upload(caminho, pdfBlob, {
      contentType: "application/pdf",
      upsert: false
    });

  if(error){
    alert("ERRO AO SALVAR CONTRATO");
    console.error(error);
    return;
  }

  // URL PÚBLICA
  const { data } = supabase
    .storage
    .from("buffet_contratos")
    .getPublicUrl(caminho);

  // SALVAR URL
  localStorage.setItem("contrato_pdf_url", data.publicUrl);

  console.log("PDF SALVO EM:", data.publicUrl);
}

/* EXECUTA */
setTimeout(gerarEEnviarPDF, 800);
</script>

</body>
</html>
