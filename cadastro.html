<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#ff6a00;
  --bg:#f4f6f8;
  --card:#fff;
  --border:#e5e7eb;
  --text:#111;
}
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:var(--bg);color:var(--text)}
header{background:#fff;padding:14px;display:flex;justify-content:center;border-bottom:1px solid var(--border)}
header img{height:54px}
.container{max-width:1200px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.06)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:800;border-bottom:1px solid var(--border);padding-bottom:8px}
label{font-size:12px;font-weight:700;margin-top:10px;display:block}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #d1d5db;margin-top:6px;font-size:16px}
input:focus{outline:none;border-color:var(--primary)}
.readonly{background:#f1f1f1}
.actions{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.btn{padding:18px;border:none;border-radius:999px;font-weight:800;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#ff6a00,#ff9a57);color:#fff}
</style>
</head>

<body>

<header>
  <img src="logo.png">
</header>

<div class="container">

<form id="formCadastro">
<div class="grid">

<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>
<label>NOME</label><input id="nome">
<label>CPF</label><input id="cpf">
<label>RG</label><input id="rg">
<label>NASCIMENTO</label><input id="nascimento" type="date">
<label>PROFISSÃO</label><input id="profissao">
<label>WHATSAPP</label><input id="telefone">
<label>E-MAIL</label><input id="email" type="email" style="text-transform:none">
</div>

<div class="card">
<h2>ENDEREÇO</h2>
<label>CEP</label><input id="cep">
<label>RUA</label><input id="rua" class="readonly" readonly>
<label>NÚMERO</label><input id="numero">
<label>BAIRRO</label><input id="bairro" class="readonly" readonly>
<label>CIDADE</label><input id="cidade" class="readonly" readonly>
<label>UF</label><input id="uf" class="readonly" readonly>
</div>

<div class="card">
<h2>EMERGÊNCIA</h2>
<label>NOME</label><input id="em_nome">
<label>PARENTESCO</label><input id="em_parentesco">
<label>TELEFONE</label><input id="em_telefone">
</div>

</div>

<div class="actions">
<button class="btn btn-primary">CONFIRMAR</button>
</div>
</form>
</div>

<script>
/* ================= ELEMENTOS ================= */
const el = id => document.getElementById(id);

const form = el("formCadastro");
const campos = [
 "nome","cpf","rg","nascimento","profissao","telefone","email",
 "cep","rua","numero","bairro","cidade","uf",
 "em_nome","em_parentesco","em_telefone"
];

/* ================= RESTAURAR STORAGE ================= */
const salvo = localStorage.getItem("cadastro_savio");
if(salvo){
  const d = JSON.parse(salvo);
  campos.forEach(c=>{
    if(d[c] !== undefined) el(c).value = d[c];
  });
}

/* ================= CEP ================= */
el("cep").addEventListener("blur", async ()=>{
  const c = el("cep").value.replace(/\D/g,"");
  if(c.length !== 8) return;
  const r = await fetch(`https://viacep.com.br/ws/${c}/json/`).then(r=>r.json());
  if(r.erro) return alert("CEP não encontrado");
  el("rua").value = r.logradouro;
  el("bairro").value = r.bairro;
  el("cidade").value = r.localidade;
  el("uf").value = r.uf;
});

/* ================= SUBMIT ================= */
form.addEventListener("submit", e=>{
  e.preventDefault();
  const dados = {};
  campos.forEach(c=>dados[c] = el(c).value);
  localStorage.setItem("cadastro_savio", JSON.stringify(dados));
  alert("DADOS SALVOS COM SUCESSO");
});
</script>

</body>
</html>
