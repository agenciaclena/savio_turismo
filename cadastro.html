<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sávio Turismo • Contrato</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--primary:#ff6a00;--border:#e5e7eb}
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#f3f4f6;color:#111}
.hidden{display:none}

/* LISTA */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.08);cursor:pointer}
.card img{width:100%;height:120px;object-fit:cover}
.card-body{padding:12px}
.card-body h4{font-size:14px;font-weight:800}
.price{font-weight:900}

/* CONTRATO */
#contratoBox{max-width:820px;margin:20px auto;background:#fff;border-radius:18px;padding:24px}
h2,h3{font-weight:800}
.fleg{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.toggle{width:52px;height:28px;background:#ccc;border-radius:999px;position:relative}
.toggle::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px}
input:checked+.toggle{background:var(--primary)}
input:checked+.toggle::after{transform:translateX(24px)}
canvas{border:2px dashed #aaa;border-radius:8px;width:100%;height:160px;margin-top:12px}

button{
  width:100%;height:54px;border:none;border-radius:999px;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;font-weight:800;font-size:16px;margin-top:16px
}
</style>
</head>

<body>

<!-- ================= LISTA DE EXCURSÕES ================= -->
<div id="lista" class="grid"></div>

<!-- ================= CONTRATO ================= -->
<div id="contratoBox" class="hidden">

  <h2>CONTRATO DE PRESTAÇÃO DE SERVIÇOS TURÍSTICOS</h2>

  <p>
    <strong>SÁVIO TURISMO</strong>, CNPJ 56.173.108/0001-30,
    e <strong id="c_nome"></strong>, CPF <strong id="c_cpf"></strong>,
    RG <strong id="c_rg"></strong>.
  </p>

  <h3>I. OBJETO</h3>
  <p>Excursão <strong id="p_titulo"></strong></p>

  <h3>II. VALOR</h3>
  <p><strong id="p_valor"></strong></p>

  <h3>III. DECLARAÇÕES</h3>
  <p>Declaro que li e aceito integralmente os termos.</p>

  <div class="fleg">
    <span>Aceito o contrato</span>
    <label><input type="checkbox" class="chk" hidden><div class="toggle"></div></label>
  </div>
  <div class="fleg">
    <span>Ciência dos riscos</span>
    <label><input type="checkbox" class="chk" hidden><div class="toggle"></div></label>
  </div>
  <div class="fleg">
    <span>Autorizo LGPD</span>
    <label><input type="checkbox" class="chk" hidden><div class="toggle"></div></label>
  </div>

  <h3>ASSINATURA</h3>
  <canvas id="sign"></canvas>

  <button id="btnFinalizar">FINALIZAR E SALVAR CONTRATO</button>
</div>

<script>
/* ================= SUPABASE ================= */
const sb = supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

function pub(path){
  return sb.storage.from("buffet_excursoes").getPublicUrl(path).data.publicUrl;
}

/* ================= LISTAR PACOTES ================= */
let excursaoSelecionada = null;

async function carregar(){
  const { data } = await sb.from("excursoes").select("*").eq("status","Ativa");
  lista.innerHTML="";
  (data||[]).forEach(e=>{
    lista.innerHTML+=`
      <div class="card" onclick='abrirContrato(${JSON.stringify(e)})'>
        <img src="${pub(e.poster_url)}">
        <div class="card-body">
          <h4>${e.titulo}</h4>
          <div class="price">${Number(e.valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}</div>
        </div>
      </div>
    `;
  });
}
carregar();

/* ================= CONTRATO ================= */
function abrirContrato(e){
  excursaoSelecionada = e;
  document.getElementById("lista").classList.add("hidden");
  document.getElementById("contratoBox").classList.remove("hidden");

  const dados = JSON.parse(localStorage.getItem("cadastro")||"{}");

  c_nome.innerText = dados.nome || "CLIENTE";
  c_cpf.innerText  = dados.cpf  || "000.000.000-00";
  c_rg.innerText   = dados.rg   || "0000000";
  p_titulo.innerText = e.titulo;
  p_valor.innerText  = Number(e.valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

/* ================= ASSINATURA ================= */
const canvas = document.getElementById("sign");
const ctx = canvas.getContext("2d");
let draw=false;

canvas.onmousedown=()=>draw=true;
canvas.onmouseup=()=>{draw=false;ctx.beginPath()};
canvas.onmousemove=e=>{
  if(!draw) return;
  ctx.lineWidth=2;
  ctx.lineCap="round";
  ctx.lineTo(e.offsetX,e.offsetY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.offsetX,e.offsetY);
};

/* ================= FINALIZAR ================= */
btnFinalizar.onclick = async ()=>{
  if(![...document.querySelectorAll(".chk")].every(c=>c.checked)){
    alert("Aceite todos os termos");
    return;
  }

  /* CLONA HTML */
  const clone = document.getElementById("contratoBox").cloneNode(true);
  clone.style.display="block";
  document.body.appendChild(clone);

  const canvasRender = await html2canvas(clone,{scale:2,backgroundColor:"#fff"});
  clone.remove();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");

  const w = pdf.internal.pageSize.getWidth();
  const h = (canvasRender.height * w) / canvasRender.width;

  pdf.addImage(canvasRender.toDataURL("image/png"),"PNG",0,0,w,h);

  const blob = pdf.output("blob");
  const nome = `CONTRATO_${Date.now()}.pdf`;

  await sb.storage.from("buffet_contratos").upload(nome,blob,{contentType:"application/pdf"});

  alert("CONTRATO SALVO COM SUCESSO");
};
</script>

</body>
</html>
