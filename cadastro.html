<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sávio Turismo • Cadastro</title>

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#ff6a00;
  --bg:#f4f6f8;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
}

*{
  box-sizing:border-box;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  text-transform:uppercase;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  -webkit-text-size-adjust:100%;
}

/* HEADER */
header{
  background:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid var(--border);
}
header img{height:46px}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:14px 14px 120px;
}

/* RESUMO PACOTE */
.pacote{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  margin-bottom:18px;
}
.pacote img{
  width:100%;
  height:170px;
  object-fit:cover;
}
.pacote-body{
  padding:14px;
}
.pacote-body h3{
  margin:0 0 6px;
  font-size:16px;
  font-weight:800;
}
.pacote-body p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}
.pacote-body strong{
  display:block;
  margin-top:6px;
  font-size:17px;
  color:var(--primary);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:1200px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

/* CARD */
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
}
.card h2{
  margin:0 0 12px;
  font-size:13px;
  font-weight:800;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

/* INPUTS */
label{
  display:block;
  margin-top:12px;
  font-size:12px;
  font-weight:700;
}

input{
  width:100%;
  margin-top:6px;
  padding:14px;
  border-radius:12px;
  border:1px solid #d1d5db;
  font-size:16px;
}
input:focus{
  outline:none;
  border-color:var(--primary);
}

.readonly{
  background:#f1f5f9;
}

/* CHECKBOX NATIVO */
.checkbox{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  font-size:13px;
  font-weight:700;
}

/* ACTIONS */
.actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid var(--border);
  padding:14px;
}
.actions button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="Sávio Turismo">
</header>

<div class="container">

<!-- RESUMO DO PACOTE -->
<div class="pacote" id="boxPacote" style="display:none">
  <img id="pFoto">
  <div class="pacote-body">
    <h3 id="pTitulo"></h3>
    <p id="pDatas"></p>
    <strong id="pValor"></strong>
  </div>
</div>

<form id="formCadastro">

<div class="grid">

<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>
<label>NOME COMPLETO</label><input id="nome" required>
<label>CPF</label><input id="cpf" required>
<label>RG</label><input id="rg" required>
<label>DATA DE NASCIMENTO</label><input id="nascimento" type="date" required>
<label>PROFISSÃO</label><input id="profissao">
<label>WHATSAPP</label><input id="telefone" required>
<label>E-MAIL</label><input id="email" type="email" style="text-transform:none" required>
</div>

<div class="card">
<h2>ENDEREÇO</h2>
<label>CEP</label><input id="cep" required>
<label>RUA</label><input id="rua" class="readonly" readonly>
<label>NÚMERO</label><input id="numero" required>
<label>BAIRRO</label><input id="bairro" class="readonly" readonly>
<label>CIDADE</label><input id="cidade" class="readonly" readonly>
<label>UF</label><input id="uf" class="readonly" readonly>
</div>

<div class="card">
<h2>CONTATO DE EMERGÊNCIA</h2>
<label>NOME</label><input id="em_nome" required>
<label>PARENTESCO</label><input id="em_parentesco" required>
<label>TELEFONE</label><input id="em_telefone" required>
</div>

<div class="card">
<h2>DECLARAÇÕES</h2>

<label class="checkbox">
  <input type="checkbox" required>
  ACEITO O CONTRATO
</label>

<label class="checkbox">
  <input type="checkbox" required>
  CIÊNCIA DOS RISCOS
</label>

<label class="checkbox">
  <input type="checkbox" required>
  AUTORIZO LGPD
</label>

</div>

</div>

<div class="actions">
  <button type="submit">CONTINUAR PARA CONTRATO</button>
</div>

</form>
</div>

<script>
/* PACOTE */
const pacote = JSON.parse(localStorage.getItem("pacoteSelecionado")||"null");
if(pacote){
  boxPacote.style.display="block";
  pFoto.src = pacote.foto;
  pTitulo.innerText = pacote.titulo;
  pDatas.innerText = pacote.datas;
  pValor.innerText = pacote.valor;
}

/* SUBMIT */
formCadastro.onsubmit = e=>{
  e.preventDefault();

  const cadastro = {
    nome:nome.value,
    cpf:cpf.value,
    rg:rg.value,
    nascimento:nascimento.value,
    profissao:profissao.value,
    telefone:telefone.value,
    email:email.value,
    endereco:{
      cep:cep.value,
      rua:rua.value,
      numero:numero.value,
      bairro:bairro.value,
      cidade:cidade.value,
      uf:uf.value
    },
    emergencia:{
      nome:em_nome.value,
      parentesco:em_parentesco.value,
      telefone:em_telefone.value
    }
  };

  localStorage.setItem("cadastro", JSON.stringify(cadastro));
  location.href = "contrato.html";
};
</script>

</body>
</html>
