<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#ff6a00;
  --bg:#f4f6f8;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111;
}

*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  background:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid var(--border);
}
header img{height:56px}

.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

@media(min-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(min-width:1200px){
  .grid{grid-template-columns:repeat(3,1fr)}
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.06);
}

.card h2{
  margin:0 0 12px;
  font-size:14px;
  font-weight:800;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

label{
  font-size:11px;
  font-weight:700;
  display:block;
  margin-top:8px;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d1d5db;
  margin-top:4px;
  font-size:14px;
}

input:focus{
  outline:none;
  border-color:var(--primary);
}

.readonly{
  background:#f1f1f1;
}

/* ===== SWITCH BONITO ===== */
.switch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:12px 0;
  font-size:13px;
  font-weight:700;
}

.switch input{
  display:none;
}

.slider{
  width:52px;
  height:30px;
  background:#d1d5db;
  border-radius:999px;
  position:relative;
  transition:.3s;
  cursor:pointer;
}

.slider::before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  background:#fff;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.3s;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

.switch input:checked + .slider{
  background:var(--primary);
}

.switch input:checked + .slider::before{
  transform:translateX(22px);
}

/* ===== BOTÕES ===== */
.actions{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:999px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}

.btn-clear{
  background:#e5e7eb;
  color:#111;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">
<form id="formCadastro">

<div class="grid">

<!-- DADOS -->
<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>

<label>NOME COMPLETO</label>
<input id="nome" required>

<label>CPF</label>
<input id="cpf" inputmode="numeric" required>

<label>RG</label>
<input id="rg" inputmode="numeric" required>

<label>DATA DE NASCIMENTO</label>
<input id="nascimento" type="date" required>

<label>PROFISSÃO</label>
<input id="profissao">

<label>WHATSAPP</label>
<input id="telefone" inputmode="numeric" required>

<label>E-MAIL</label>
<input id="email" type="email" style="text-transform:none" required>
</div>

<!-- ENDEREÇO -->
<div class="card">
<h2>ENDEREÇO</h2>

<label>CEP</label>
<input id="cep" inputmode="numeric" required>

<label>RUA</label>
<input id="rua" class="readonly" readonly>

<label>NÚMERO</label>
<input id="numero" inputmode="numeric" required>

<label>BAIRRO</label>
<input id="bairro" class="readonly" readonly>

<label>CIDADE</label>
<input id="cidade" class="readonly" readonly>

<label>UF</label>
<input id="uf" class="readonly" readonly>
</div>

<!-- EMERGÊNCIA -->
<div class="card">
<h2>CONTATO DE EMERGÊNCIA</h2>

<label>NOME</label>
<input id="em_nome" required>

<label>PARENTESCO</label>
<input id="em_parentesco" required>

<label>TELEFONE</label>
<input id="em_telefone" inputmode="numeric" required>
</div>

<!-- SAÚDE -->
<div class="card">
<h2>INFORMAÇÕES DE SAÚDE</h2>

<label>CONDIÇÃO</label>
<input id="saude_condicao">

<label>MEDICAMENTOS</label>
<input id="saude_medicamentos">

<label>ALERGIAS</label>
<input id="saude_alergias">

<label>TIPO SANGUÍNEO</label>
<input id="saude_sangue">
</div>

<!-- PACOTE -->
<div class="card">
<h2>PACOTE SELECIONADO</h2>

<label>PACOTE</label>
<input id="pacote_nome" class="readonly" readonly>

<label>PERÍODO</label>
<input id="pacote_periodo" class="readonly" readonly>

<label>VALOR</label>
<input id="pacote_valor" class="readonly" readonly>
</div>

<!-- ACEITES -->
<div class="card">
<h2>DECLARAÇÕES</h2>

<div class="switch">
  <span>ACEITO O CONTRATO</span>
  <label>
    <input type="checkbox" id="aceite_contrato" required>
    <span class="slider"></span>
  </label>
</div>

<div class="switch">
  <span>CIÊNCIA DOS RISCOS</span>
  <label>
    <input type="checkbox" id="aceite_risco" required>
    <span class="slider"></span>
  </label>
</div>

<div class="switch">
  <span>AUTORIZO LGPD</span>
  <label>
    <input type="checkbox" id="aceite_lgpd" required>
    <span class="slider"></span>
  </label>
</div>

</div>

</div>

<div class="actions">
  <button type="submit" class="btn btn-primary">CONFIRMAR DADOS</button>
  <button type="button" class="btn btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>
</div>

</form>
</div>

<script>
/* ===== SUPABASE ===== */
const sb = window.supabase.createClient(
  "https://ghkfeobnrfvqwzuliqfz.supabase.co",
  "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

const STORAGE_KEY = "cadastro_savio";

/* ===== HELPERS ===== */
function getId(){
  return new URLSearchParams(location.search).get("id");
}
function formatarData(d){
  if(!d) return "";
  const [y,m,da]=d.split("-");
  return `${da}/${m}/${y}`;
}

/* ===== PACOTE ===== */
async function carregarPacote(){
  const id = getId();
  const { data } = await sb.from("excursoes").select("*").eq("id",id).single();
  if(!data) return;

  pacote_nome.value = data.titulo;
  pacote_periodo.value = formatarData(data.data_saida)+" A "+formatarData(data.data_retorno);
  pacote_valor.value = Number(data.valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  localStorage.setItem("pacote",JSON.stringify(data));
}

/* ===== CEP ===== */
cep.onblur = ()=>{
  const c = cep.value.replace(/\D/g,"");
  if(c.length!==8) return;
  fetch(`https://viacep.com.br/ws/${c}/json/`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.erro){
        rua.value=d.logradouro;
        bairro.value=d.bairro;
        cidade.value=d.localidade;
        uf.value=d.uf;
      }
    });
};

/* ===== STORAGE ===== */
function salvar(){
  const dados={};
  document.querySelectorAll("input").forEach(i=>{
    dados[i.id]=i.type==="checkbox"?i.checked:i.value;
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}
function restaurar(){
  const dados=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  Object.keys(dados).forEach(k=>{
    const el=document.getElementById(k);
    if(el){
      el.type==="checkbox"?el.checked=dados[k]:el.value=dados[k];
    }
  });
}
function limparTudo(){
  if(confirm("DESEJA LIMPAR TODOS OS DADOS?")){
    localStorage.clear();
    location.reload();
  }
}

/* ===== SUBMIT ===== */
formCadastro.onsubmit=e=>{
  e.preventDefault();
  salvar();
  location.href="resumo.html";
};

window.addEventListener("DOMContentLoaded",()=>{
  restaurar();
  carregarPacote();
});
</script>

</body>
</html>
