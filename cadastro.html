<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SÁVIO TURISMO • CADASTRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter;text-transform:uppercase}
body{margin:0;background:#f4f6f8;color:#111}
header{
  background:#fff;
  padding:16px;
  display:flex;
  justify-content:center;
  border-bottom:1px solid #e5e7eb
}
header img{height:60px}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 24px rgba(0,0,0,.06)
}
.card h2{
  margin:0 0 12px;
  font-size:15px;
  border-bottom:1px solid #eee;
  padding-bottom:8px
}
label{font-size:12px;font-weight:700}
input{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #d1d5db;
  margin:6px 0 12px;
  font-size:14px
}
input:focus{outline:none;border-color:#ff6a00}
.readonly{background:#f1f1f1}
.checks label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  margin-bottom:10px
}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  font-size:16px;
  font-weight:800;
  cursor:pointer
}
.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
.btn-clear{
  background:#e5e7eb;
  color:#111;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" alt="SÁVIO TURISMO">
</header>

<div class="container">
<form id="formCadastro">

<div class="grid">

<!-- DADOS DO PASSAGEIRO -->
<div class="card">
<h2>DADOS DO PASSAGEIRO</h2>

<label>NOME COMPLETO</label>
<input id="nome" required>

<label>CPF</label>
<input id="cpf" inputmode="numeric" required>

<label>RG</label>
<input id="rg" inputmode="numeric" required>

<label>DATA DE NASCIMENTO</label>
<input id="nascimento" type="date" required>

<label>PROFISSÃO</label>
<input id="profissao">

<label>WHATSAPP</label>
<input id="telefone" inputmode="numeric" required>

<label>E-MAIL</label>
<input id="email" type="email" style="text-transform:none" required>
</div>

<!-- ENDEREÇO -->
<div class="card">
<h2>ENDEREÇO</h2>

<label>CEP</label>
<input id="cep" inputmode="numeric" required>

<label>RUA</label>
<input id="rua" class="readonly" readonly>

<label>NÚMERO</label>
<input id="numero" inputmode="numeric" required>

<label>BAIRRO</label>
<input id="bairro" class="readonly" readonly>

<label>CIDADE</label>
<input id="cidade" class="readonly" readonly>

<label>UF</label>
<input id="uf" class="readonly" readonly>
</div>

<!-- CONTATO DE EMERGÊNCIA -->
<div class="card">
<h2>CONTATO DE EMERGÊNCIA</h2>

<label>NOME</label>
<input id="em_nome" required>

<label>PARENTESCO</label>
<input id="em_parentesco" required>

<label>TELEFONE</label>
<input id="em_telefone" inputmode="numeric" required>
</div>

<!-- SAÚDE -->
<div class="card">
<h2>INFORMAÇÕES DE SAÚDE (OPCIONAL)</h2>

<label>CONDIÇÃO DE SAÚDE</label>
<input id="saude_condicao">

<label>MEDICAMENTOS</label>
<input id="saude_medicamentos">

<label>ALERGIAS</label>
<input id="saude_alergias">

<label>TIPO SANGUÍNEO</label>
<input id="saude_sangue">
</div>

<!-- PACOTE -->
<div class="card">
<h2>PACOTE SELECIONADO</h2>

<label>PACOTE</label>
<input id="pacote_nome" class="readonly" readonly>

<label>PERÍODO</label>
<input id="pacote_periodo" class="readonly" readonly>

<label>VALOR</label>
<input id="pacote_valor" class="readonly" readonly>
</div>

<!-- ACEITES -->
<div class="card">
<h2>DECLARAÇÕES</h2>
<div class="checks">
<label><input type="checkbox" id="aceite_contrato" required> LI E ACEITO O CONTRATO</label>
<label><input type="checkbox" id="aceite_risco" required> CIÊNCIA DOS RISCOS</label>
<label><input type="checkbox" id="aceite_lgpd" required> AUTORIZO LGPD</label>
</div>
</div>

</div>

<button type="submit" class="btn btn-primary">CONFIRMAR DADOS</button>
<button type="button" class="btn btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>

</form>
</div>

<script>
/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

/* ================= STORAGE ================= */
const STORAGE_KEY = "cadastro_savio";

/* ================= PACOTE ================= */
function getId(){
  return new URLSearchParams(location.search).get("id");
}

async function carregarPacote(){
  const id = getId();
  if(!id) return alert("PACOTE NÃO INFORMADO");

  const {data,error} = await supabase
    .from("excursoes")
    .select("*")
    .eq("id",id)
    .single();

  if(error) return alert("PACOTE NÃO ENCONTRADO");

  pacote_nome.value = data.titulo;
  pacote_periodo.value = formatarData(data.data_saida)+" A "+formatarData(data.data_retorno);
  pacote_valor.value = Number(data.valor).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

  localStorage.setItem("pacote",JSON.stringify(data));
}

function formatarData(d){
  const [y,m,da]=d.split("-");
  return `${da}/${m}/${y}`;
}

/* ================= MÁSCARAS ================= */
function mask(el,p){
  let i=0,v=el.value.replace(/\D/g,"");
  el.value=p.replace(/#/g,_=>v[i++]||"");
}
cpf.oninput=()=>mask(cpf,"###.###.###-##");
telefone.oninput=()=>mask(telefone,"(##) #####-####");
em_telefone.oninput=()=>mask(em_telefone,"(##) #####-####");
cep.oninput=()=>mask(cep,"#####-###");

/* ================= CEP ================= */
cep.onblur=()=>{
  const c=cep.value.replace(/\D/g,"");
  if(c.length!==8) return;
  fetch(`https://viacep.com.br/ws/${c}/json/`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.erro){
        rua.value=d.logradouro;
        bairro.value=d.bairro;
        cidade.value=d.localidade;
        uf.value=d.uf;
      }
    });
};

/* ================= LOCAL STORAGE ================= */
function salvar(){
  const dados = {};
  document.querySelectorAll("input").forEach(i=>{
    dados[i.id] = i.type==="checkbox" ? i.checked : i.value;
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify(dados));
}

function restaurar(){
  const dados = JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  Object.keys(dados).forEach(k=>{
    const el=document.getElementById(k);
    if(el){
      if(el.type==="checkbox") el.checked=dados[k];
      else el.value=dados[k];
    }
  });
}

function limparTudo(){
  if(confirm("DESEJA LIMPAR TODOS OS DADOS?")){
    localStorage.clear();
    location.reload();
  }
}

document.addEventListener("input",salvar);
window.addEventListener("DOMContentLoaded",()=>{
  restaurar();
  carregarPacote();
});

/* ================= SUBMIT ================= */
formCadastro.onsubmit=e=>{
  e.preventDefault();
  salvar();
  location.href="resumo.html";
};
</script>

</body>
</html>
