<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>RESUMO • SÁVIO TURISMO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Inter,Arial;margin:0;padding:20px}
h2{margin-top:0}
p{margin:6px 0}
.btn{margin-top:20px;padding:14px;border:none;border-radius:10px;background:#ff6a00;color:#fff;font-weight:800}
</style>
</head>
<body>

<h2>RESUMO DO CADASTRO</h2>
<div id="box"></div>

<button class="btn" onclick="location.href='assinatura.html'">ASSINAR CONTRATO</button>

<script>
const dados = JSON.parse(localStorage.getItem("cadastro_savio")||"{}");
const box = document.getElementById("box");
box.innerHTML = Object.entries(dados)
  .map(([k,v])=>`<p><strong>${k}:</strong> ${v}</p>`).join("");
</script>

</body>
</html>
