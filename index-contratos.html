<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contratos • Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}

:root{
  --primary:#ff6a00;
  --success:#16a34a;
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --muted:#6b7280;
}

body{
  background:var(--bg);
  color:#111;
}

/* HEADER */
.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{
  font-size:22px;
  font-weight:800;
}
.header-actions{
  display:flex;
  gap:12px;
}
.download{
  border:1px solid var(--border);
  background:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:800;
}

/* SEARCH */
.search{
  padding:0 20px 10px;
}
.search input{
  width:100%;
  height:46px;
  border-radius:14px;
  border:1px solid var(--border);
  padding:0 16px;
  font-size:14px;
}

/* LIST */
.list{
  padding:20px;
  display:grid;
  gap:14px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  box-shadow:0 10px 26px rgba(0,0,0,.08);
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  cursor:pointer;
}

.card h4{
  font-size:15px;
  font-weight:800;
}

.meta{
  font-size:13px;
  color:var(--muted);
}

.price{
  font-weight:900;
  margin-top:4px;
}

.badge{
  font-size:11px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  display:inline-block;
  margin-top:6px;
}
.assinado{background:#fef3c7;color:#92400e}
.pago{background:#dcfce7;color:#166534}

.actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:flex-end;
}

.btn{
  height:34px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#fff;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.btn.pago{
  border-color:var(--success);
  color:var(--success);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  z-index:999;
}
.modal.show{display:flex}

.sheet{
  background:#fff;
  width:100%;
  max-height:90vh;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}

.sheet-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.sheet-body{
  padding:16px;
  overflow:auto;
  display:grid;
  gap:10px;
}

.sheet-body p{
  font-size:13px;
  color:#444;
}

.sheet-footer{
  padding:16px;
  border-top:1px solid var(--border);
  display:flex;
  gap:12px;
}

.sheet-footer a{
  flex:1;
  text-align:center;
  padding:14px;
  border-radius:999px;
  background:var(--primary);
  color:#fff;
  text-decoration:none;
  font-weight:900;
}
</style>
</head>

<body>

<div class="header">
  <h1>📄 Contratos</h1>
  <div class="header-actions">
    <div class="download" onclick="baixarTodos()">⬇️ Baixar todos</div>
  </div>
</div>

<div class="search">
  <input id="busca" placeholder="Buscar passageiro, excursão ou data...">
</div>

<div class="list" id="lista"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="fechar(event)">
  <div class="sheet">
    <div class="sheet-header">
      <span id="mTitulo"></span>
      <span onclick="fechar()">✕</span>
    </div>
    <div class="sheet-body" id="mBody"></div>
    <div class="sheet-footer">
      <a id="mPdf" target="_blank">Abrir contrato (PDF)</a>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let contratos = [];

async function carregar(){
  const { data } = await sb
    .from("contratos")
    .select("*, excursoes(titulo,data_saida)")
    .order("created_at",{ascending:false});

  contratos = data || [];
  render();
}

function render(){
  const q = busca.value.toLowerCase();
  lista.innerHTML = "";

  contratos
    .filter(c =>
      c.nome.toLowerCase().includes(q) ||
      (c.excursoes?.titulo || "").toLowerCase().includes(q) ||
      (c.excursoes?.data_saida || "").includes(q)
    )
    .forEach(c=>{
      lista.innerHTML += `
        <div class="card" onclick="abrir('${c.id}')">
          <div>
            <h4>${c.nome}</h4>
            <div class="meta">${c.excursoes?.titulo || ""}</div>
            <div class="meta">📅 ${c.excursoes?.data_saida || ""}</div>
            <div class="price">R$ ${(c.valor/100).toFixed(2)}</div>
            <span class="badge ${c.status==='PAGO'?'pago':'assinado'}">${c.status}</span>
          </div>
          <div class="actions">
            ${c.status!=="PAGO"
              ? `<button class="btn" onclick="marcarPago(event,'${c.id}')">Marcar pago</button>`
              : `<div class="btn pago">Pago</div>`
            }
            <button class="btn" onclick="window.open('${c.pdf_url}')">❤️</button>
          </div>
        </div>
      `;
    });
}

async function marcarPago(e,id){
  e.stopPropagation();
  if(!confirm("Confirmar pagamento?")) return;

  await sb.from("contratos").update({status:"PAGO"}).eq("id",id);
  carregar();
}

function abrir(id){
  const c = contratos.find(i=>i.id===id);
  if(!c) return;

  mTitulo.innerText = c.nome;
  const saude = JSON.parse(c.info_saude||"{}");

  mBody.innerHTML = `
    <p><b>CPF:</b> ${c.cpf}</p>
    <p><b>Telefone:</b> ${c.telefone}</p>
    <p><b>Email:</b> ${c.email}</p>
    <p><b>Endereço:</b> ${c.endereco}</p>
    <hr>
    <p><b>Emergência:</b> ${c.emergencia_nome} (${c.emergencia_parentesco})</p>
    <p><b>Contato:</b> ${c.emergencia_telefone}</p>
    <hr>
    <p><b>Saúde:</b></p>
    <p>Sangue: ${saude.sangue||"-"}</p>
    <p>Alergias: ${saude.alergias||"-"}</p>
    <p>Condição: ${saude.condicao||"-"}</p>
    <p>Medicamentos: ${saude.medicamentos||"-"}</p>
  `;

  mPdf.href = c.pdf_url;
  modal.classList.add("show");
}

function fechar(e){
  if(e && e.target!==e.currentTarget) return;
  modal.classList.remove("show");
}

function baixarTodos(){
  contratos.forEach(c=>{
    if(c.pdf_url) window.open(c.pdf_url);
  });
}

busca.oninput = render;
carregar();
</script>

</body>
</html>
