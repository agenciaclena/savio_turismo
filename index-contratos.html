<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Contratos • Sávio Turismo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:#f4f6fb;color:#111}

.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{font-size:22px;font-weight:800}

.search{
  margin:0 20px 20px;
}
.search input{
  width:100%;
  height:44px;
  border-radius:14px;
  border:1px solid #e5e7eb;
  padding:0 16px;
  font-size:14px;
}

.list{
  padding:0 20px 100px;
  display:grid;
  gap:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  cursor:pointer;
}

.card.pago{border-left:6px solid #16a34a}
.card.assinado{border-left:6px solid #f59e0b}

.badge{
  font-size:11px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  display:inline-block;
}
.badge.pago{background:#dcfce7;color:#166534}
.badge.assinado{background:#fef3c7;color:#92400e}

.card h4{margin:0;font-size:15px}
.meta{font-size:12px;color:#6b7280}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.btn{
  border:none;
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.btn-pagar{
  background:#fff;
  border:2px solid #16a34a;
  color:#16a34a;
}
.btn-pagar:hover{background:#16a34a;color:#fff}

.btn-download{
  background:#2563eb;
  color:#fff;
}

.top-btn{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:10px 16px;
  font-weight:800;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.modal.show{display:flex}

.modal-box{
  background:#fff;
  width:92%;
  max-width:520px;
  border-radius:22px;
  padding:20px;
}

.modal-box h3{margin-top:0}

.modal-box p{
  font-size:13px;
  margin:6px 0;
}
</style>
</head>

<body>

<div class="header">
  <h1>Contratos</h1>
  <button class="top-btn" onclick="baixarTodos()">⬇ Baixar todos</button>
</div>

<div class="search">
  <input id="busca" placeholder="Buscar passageiro, excursão ou data...">
</div>

<div class="list" id="lista"></div>

<div class="modal" id="modal" onclick="fecharModal(event)">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let contratos = [];
let excursoesMap = {};

async function carregar(){
  const { data: excursoes } = await sb
    .from("excursoes")
    .select("id,titulo,data_saida");

  (excursoes||[]).forEach(e=>excursoesMap[e.id]=e);

  const { data } = await sb
    .from("contratos")
    .select("*")
    .order("created_at",{ascending:false});

  contratos = data || [];
  render();
}

function render(){
  const q = busca.value.toLowerCase();
  lista.innerHTML = "";

  contratos
    .filter(c=>{
      const ex = excursoesMap[c.excursao_id]||{};
      return (
        c.nome.toLowerCase().includes(q) ||
        (ex.titulo||"").toLowerCase().includes(q) ||
        (ex.data_saida||"").includes(q)
      );
    })
    .forEach(c=>{
      const ex = excursoesMap[c.excursao_id]||{};
      const pago = c.status === "PAGO";

      lista.innerHTML += `
        <div class="card ${pago?"pago":"assinado"}" onclick="abrir('${c.id}')">
          <div>
            <h4>${c.nome}</h4>
            <div class="meta">${ex.titulo||""}</div>
            <div class="meta">📅 ${ex.data_saida||""}</div>
            <div class="meta">💰 R$ ${(c.valor/100).toFixed(2)}</div>
            <span class="badge ${pago?"pago":"assinado"}">${c.status}</span>
          </div>
          <div class="actions" onclick="event.stopPropagation()">
            ${!pago?`<button class="btn btn-pagar" onclick="pagar('${c.id}')">Marcar pago</button>`:""}
            <button class="btn btn-download" onclick="window.open('${c.pdf_url}')">PDF</button>
          </div>
        </div>
      `;
    });
}

function pagar(id){
  if(!confirm("Confirmar pagamento manual?")) return;
  sb.from("contratos").update({status:"PAGO"}).eq("id",id).then(carregar);
}

function abrir(id){
  const c = contratos.find(i=>i.id===id);
  const ex = excursoesMap[c.excursao_id]||{};
  modalBox.innerHTML = `
    <h3>${c.nome}</h3>
    <p><b>Excursão:</b> ${ex.titulo||""}</p>
    <p><b>Data:</b> ${ex.data_saida||""}</p>
    <p><b>CPF:</b> ${c.cpf}</p>
    <p><b>Telefone:</b> ${c.telefone}</p>
    <p><b>Email:</b> ${c.email}</p>
    <p><b>Endereço:</b> ${c.endereco}</p>
    <p><b>Saúde:</b> ${c.info_saude||""}</p>
    <button class="btn btn-download" onclick="window.open('${c.pdf_url}')">Abrir contrato PDF</button>
  `;
  modal.classList.add("show");
}

function fecharModal(e){
  if(e.target.id==="modal") modal.classList.remove("show");
}

function baixarTodos(){
  contratos.forEach(c=>window.open(c.pdf_url));
}

busca.oninput = render;
carregar();
</script>

</body>
</html>
