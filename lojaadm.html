<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Painel da Loja | Excursões</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #f3f4f6;
}
header {
  background: #0f172a;
  color: #fff;
  padding: 16px;
  font-size: 20px;
}
.container {
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 20px;
}
h2 {
  margin-top: 0;
}
input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
button {
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
}
button:hover {
  background: #1d4ed8;
}
.list {
  display: grid;
  gap: 10px;
}
.excursao-item {
  border: 1px solid #e5e7eb;
  padding: 12px;
  border-radius: 8px;
}
</style>
</head>

<body>
<header>🏖️ Painel da Loja – Gestão de Excursões</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login da Loja</h2>
  <input id="email" placeholder="E-mail" />
  <input id="password" type="password" placeholder="Senha" />
  <button onclick="login()">Entrar</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

  <!-- DADOS DA LOJA -->
  <div class="card">
    <h2>Dados da Loja</h2>
    <input id="nome_fantasia" placeholder="Nome Fantasia" />
    <input id="razao_social" placeholder="Razão Social" />
    <input id="cnpj" placeholder="CNPJ" />
    <input id="telefone" placeholder="Telefone" />
    <input id="endereco" placeholder="Endereço Completo" />
    <button onclick="salvarLoja()">Salvar Dados da Loja</button>
  </div>

  <!-- CADASTRO DE EXCURSÃO -->
  <div class="card">
    <h2>Cadastrar Excursão</h2>
    <input id="titulo" placeholder="Título da Excursão" />
    <input id="destino" placeholder="Destino" />
    <textarea id="descricao" placeholder="Descrição detalhada"></textarea>

    <input type="date" id="data_saida" />
    <input type="date" id="data_retorno" />
    <input id="local_embarque" placeholder="Local de Embarque" />
    <input id="local_desembarque" placeholder="Local de Desembarque" />

    <input id="valor" placeholder="Valor por Pessoa" />
    <input id="parcelas" placeholder="Quantidade de Parcelas" />
    <input id="hospedagem_dias" placeholder="Dias de Hospedagem" />

    <label><input type="checkbox" id="inclui_cafe" /> Café da Manhã</label><br>
    <label><input type="checkbox" id="inclui_seguro" /> Seguro Viagem</label><br>
    <label><input type="checkbox" id="inclui_guia" /> Guia Turístico</label><br>
    <label><input type="checkbox" id="inclui_transporte" /> Transporte</label><br>

    <textarea id="roteiro" placeholder="Roteiro da Viagem"></textarea>

    <input type="file" id="poster" />
    <input type="file" id="videos" multiple />

    <button onclick="salvarExcursao()">Salvar Excursão</button>
  </div>

  <!-- LISTAGEM -->
  <div class="card">
    <h2>Excursões Cadastradas</h2>
    <div class="list" id="listaExcursao"></div>
  </div>

</div>
</div>

<script>
const supabase = supabase.createClient(
  'SUA_SUPABASE_URL',
  'SUA_SUPABASE_ANON_KEY'
);

let userId = null;

async function login() {
  const { data, error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });
  if (error) return alert(error.message);
  userId = data.user.id;
  loginBox.style.display = 'none';
  dashboard.style.display = 'block';
  carregarExcursao();
}

async function salvarLoja() {
  await supabase.from('loja_profile').upsert({
    id: userId,
    nome_fantasia: nome_fantasia.value,
    razao_social: razao_social.value,
    cnpj: cnpj.value,
    telefone: telefone.value,
    endereco: endereco.value
  });
  alert('Dados da loja salvos!');
}

async function salvarExcursao() {
  const posterFile = poster.files[0];
  let posterUrl = null;

  if (posterFile) {
    const { data } = await supabase.storage
      .from('posters-excursoes')
      .upload(`/${Date.now()}-${posterFile.name}`, posterFile);
    posterUrl = data.path;
  }

  const { data } = await supabase.from('excursoes').insert({
    loja_id: userId,
    titulo: titulo.value,
    destino: destino.value,
    descricao: descricao.value,
    data_saida: data_saida.value,
    data_retorno: data_retorno.value,
    local_embarque: local_embarque.value,
    local_desembarque: local_desembarque.value,
    valor: valor.value,
    parcelas: parcelas.value,
    hospedagem_dias: hospedagem_dias.value,
    inclui_cafe: inclui_cafe.checked,
    inclui_seguro: inclui_seguro.checked,
    inclui_guia: inclui_guia.checked,
    inclui_transporte: inclui_transporte.checked,
    roteiro: roteiro.value,
    poster_url: posterUrl
  });

  alert('Excursão cadastrada!');
  carregarExcursao();
}

async function carregarExcursao() {
  const { data } = await supabase
    .from('excursoes')
    .select('*')
    .eq('loja_id', userId);

  listaExcursao.innerHTML = '';
  data.forEach(e => {
    listaExcursao.innerHTML += `
      <div class="excursao-item">
        <strong>${e.titulo}</strong><br>
        ${e.destino}<br>
        Saída: ${e.data_saida} | Retorno: ${e.data_retorno}
      </div>`;
  });
}
</script>
</body>
</html>
