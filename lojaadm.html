<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro • Excursões</title>

<meta name="viewport"
  content="width=device-width,
  initial-scale=1,
  maximum-scale=1,
  user-scalable=no,
  viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* 🔥 CSS É O MESMO QUE VOCÊ ENVIOU */
</style>
</head>

<body>

<div class="loading" id="loading"><div>Salvando excursão…</div></div>

<div class="header">
  <h1>Excursões <span>Turísticas</span></h1>
  <p>Cadastro completo</p>
</div>

<div class="filters">
  <input id="search" placeholder="Buscar excursão">
  <select id="filtroStatus">
    <option value="">Todas</option>
    <option value="true">Ativas</option>
    <option value="false">Inativas</option>
  </select>
</div>

<div class="grid" id="lista"></div>
<button class="fab" onclick="abrirModalNovo()">+</button>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="sheet">

    <div class="sheet-header">
      <span id="formTitle">Nova excursão</span>
      <span onclick="fecharModal()">✕</span>
    </div>

    <div class="sheet-body">

      <label>Título da excursão</label>
      <input id="titulo">

      <label>Destino</label>
      <input id="destino">

      <label>Descrição</label>
      <textarea id="descricao"></textarea>

      <label>Data de saída</label>
      <input id="data_saida" placeholder="dd/mm/aaaa">

      <label>Data de retorno</label>
      <input id="data_retorno" placeholder="dd/mm/aaaa">

      <label>Valor por pessoa</label>
      <input id="valor" inputmode="decimal" oninput="formatarMoedaInput(this)">

      <label>Parcelas</label>
      <input id="parcelas" inputmode="numeric">

      <label>Roteiro</label>
      <textarea id="roteiro"></textarea>

      <label>
        <input type="checkbox" id="inclui_transporte">
        Inclui transporte
      </label>

      <label>
        <input type="checkbox" id="inclui_hospedagem">
        Inclui hospedagem
      </label>

      <label>
        <input type="checkbox" id="ativo">
        Excursão ativa
      </label>

      <label>Imagem da excursão</label>
      <div class="image-box" onclick="imagem.click()">
        <img id="preview" style="display:none">
        <input type="file" id="imagem" hidden accept="image/*">
      </div>

    </div>

    <div class="sheet-footer">

      <button
        id="btnExcluir"
        onclick="confirmarExclusao()"
        style="background:transparent;color:#dc2626;font-size:12px;display:none">
        Excluir
      </button>

      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvar()">Salvar</button>

    </div>

  </div>
</div>

<script>
const sb = supabase.createClient(
 "https://SUA_URL.supabase.co",
 "SUA_PUBLIC_KEY"
);

let userId, itens=[], editId=null, blob=null;

(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) location.href="login.html";
  userId = session.user.id;
  carregar();
})();

function formatarMoedaInput(i){
  let v=i.value.replace(/\D/g,'');
  i.value=(Number(v)/100).toLocaleString('pt-BR',{minimumFractionDigits:2});
}
function moeda(v){
  return Number(v.replace(/\./g,'').replace(',','.'));
}

async function salvar(){
 loading.style.display="flex";

 const payload={
  user_id:userId,
  titulo:titulo.value,
  destino:destino.value,
  descricao:descricao.value,
  data_saida:data_saida.value,
  data_retorno:data_retorno.value,
  valor:moeda(valor.value),
  parcelas:parcelas.value,
  roteiro:roteiro.value,
  inclui_transporte:inclui_transporte.checked,
  inclui_hospedagem:inclui_hospedagem.checked,
  ativo:ativo.checked
 };

 let data;
 if(editId){
  ({data}=await sb.from("excursoes").update(payload).eq("id",editId).select().single());
 }else{
  ({data}=await sb.from("excursoes").insert(payload).select().single());
 }

 if(blob){
  const path=`${userId}/${data.id}.jpg`;
  await sb.storage.from("buffet_excursoes").upload(path,blob,{upsert:true});
  const {data:s}=await sb.storage.from("buffet_excursoes").createSignedUrl(path,31536000);
  await sb.from("excursoes").update({imagem_url:s.signedUrl}).eq("id",data.id);
 }

 loading.style.display="none";
 fecharModal();
 carregar();
}

async function carregar(){
 const {data}=await sb.from("excursoes").select("*").eq("user_id",userId).order("created_at",{ascending:false});
 itens=data||[];
 render();
}

function render(){
 lista.innerHTML="";
 itens.forEach(i=>{
  lista.innerHTML+=`
   <div class="item">
    ${i.imagem_url?`<img src="${i.imagem_url}">`:""}
    <div class="item-body">
     <h4>${i.titulo}</h4>
     <span class="price">R$ ${i.valor.toFixed(2).replace('.',',')}</span>
     <div class="actions" onclick="editar('${i.id}')">Editar</div>
    </div>
   </div>`;
 });
}

imagem.addEventListener("change",()=>{
  blob=imagem.files[0];
  preview.src=URL.createObjectURL(blob);
  preview.style.display="block";
});

function editar(id){
 const i=itens.find(x=>x.id===id);
 editId=id;
 titulo.value=i.titulo;
 destino.value=i.destino;
 descricao.value=i.descricao;
 data_saida.value=i.data_saida;
 data_retorno.value=i.data_retorno;
 valor.value=i.valor.toLocaleString("pt-BR",{minimumFractionDigits:2});
 parcelas.value=i.parcelas;
 roteiro.value=i.roteiro;
 inclui_transporte.checked=i.inclui_transporte;
 inclui_hospedagem.checked=i.inclui_hospedagem;
 ativo.checked=i.ativo;
 if(i.imagem_url){preview.src=i.imagem_url;preview.style.display="block"}
 btnExcluir.style.display="block";
 modal.classList.add("show");
}

function abrirModalNovo(){
 editId=null;
 formTitle.innerText="Nova excursão";
 modal.classList.add("show");
 btnExcluir.style.display="none";
}

function fecharModal(){
 modal.classList.remove("show");
 blob=null;
 preview.style.display="none";
}

async function confirmarExclusao(){
 if(!editId) return;
 await sb.from("excursoes").delete().eq("id",editId);
 fecharModal();
 carregar();
}
</script>

</body>
</html>
