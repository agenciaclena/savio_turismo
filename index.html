<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sávio Turismo • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary: transparent;
  --bg: transparent;
  --card: transparent;
  --text: #111827;
  --muted:#6b7280;
  --radius:22px;
}

*{box-sizing:border-box;font-family:Inter}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  opacity:0;
  transition:opacity .2s ease;
}


/* HEADER */
.header{
  padding:20px 16px 10px;
}
.header h1{font-size:22px;font-weight:800}
.header span{color:var(--primary)}
.header p{font-size:13px;color:var(--muted)}

/* BANNER */
.banner{
  margin:0 16px 18px;
  border-radius:28px;
  overflow:hidden;
  position:relative;
}

.banner-track{
  display:flex;
  height:200px;
  transition:transform .6s ease;
  will-change:transform;
}

.banner-track img{
  min-width:100%;
  height:100%;
  object-fit:cover;
  user-select:none;
  pointer-events:none;
}


/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
  padding:0 16px 160px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 26px rgba(0,0,0,.08);
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.card-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card-body h4{
  font-size:14px;
  font-weight:800;
}
.price{
  font-weight:900;
}
.meta{
  font-size:12px;
  color:var(--muted);
}

.btn-whats{
  margin-top:8px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#25d366;
  color:#fff;
  font-size:13px;
  font-weight:800;
  text-decoration:none;
}

.flags{
  display:flex;
  gap:6px;
}
.flag{
  width:10px;height:10px;
  border-radius:50%;
  background:#cbd5e1;
}
.flag.on{background:var(--primary)}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  z-index:9999;
}
.modal.show{display:flex}

.sheet{
  width:100%;
  height:95vh;
  background:#fff;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}
.sheet-header{
  padding:16px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}
.sheet-body{
  flex:1;
  overflow:auto;
  padding:16px;
}
.hero{
  height:220px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:18px;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.section{margin-bottom:16px}
.section h3{font-size:14px;font-weight:800}
.section p{font-size:13px;color:var(--muted);white-space:pre-line}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.tag{
  background:#e0f2fe;
  color:#0369a1;
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.btn{
  width:100%;
  height:52px;
  border-radius:999px;
  border:none;
  font-weight:800;
  font-size:15px;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
.ultimas-vagas{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:900;
  color:#dc2626;
}

.pulse{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#dc2626;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.6}
  100%{transform:scale(1);opacity:1}
}

</style>
</head>

<body>

<div class="header">
  <h1>Sávio <span>Turismo</span></h1>
  <p>Escolha sua próxima experiência</p>
</div>

<!-- BANNER -->
<div class="banner">
  <div class="banner-track" id="bannerTrack"></div>
</div>

<!-- LISTA -->
<div class="grid" id="lista"></div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="sheet">
  <div class="sheet-header">
    <span id="mTitulo"></span>
    <span onclick="fechar()">✕</span>
  </div>
  <div class="sheet-body">
    <div class="hero" id="mHero"></div>

    <div class="section"><h3>Destino</h3><p id="mDestino"></p></div>
    <div class="section"><h3>Período</h3><p id="mDatas"></p></div>
    <div class="section"><h3>Detalhes</h3><p id="mDetalhes"></p></div>

    <div class="section">
      <h3>Inclusos</h3>
      <div class="tags" id="mInclusos"></div>
    </div>

    <div class="section">
      <h3>Formas de pagamento</h3>
      <div class="tags" id="mPagamentos"></div>
    </div>
  </div>

  <div style="padding:14px">
    <button class="btn">Quero garantir minha vaga</button>
  </div>
</div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

function pub(path){
 return sb.storage.from("buffet_excursoes").getPublicUrl(path).data.publicUrl;
}

/* BANNER */
let idx=0;
function startBanner(imgs, efeito = "slide", intervalo = 3000){
  const track = document.getElementById("bannerTrack");
  track.innerHTML = "";
  idx = 0;
// loop visual (clona primeiro e último)
if(efeito === "slide" && imgs.length > 1){
  imgs = [imgs[imgs.length - 1], ...imgs, imgs[0]];
  idx = 1;
}

track.style.transition = "none";
track.style.display = "flex";

/* posição inicial correta para loop */
if (efeito === "slide" && imgs.length > 1) {
  track.style.transform = "translateX(-100%)";
} else {
  track.style.transform = "translateX(0)";
}


  // cria imagens
  imgs.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;

    if(efeito === "fade"){
      img.style.position = "absolute";
      img.style.inset = 0;
      img.style.opacity = i === 0 ? "1" : "0";
      img.style.transition = "opacity .6s ease";
    }

    track.appendChild(img);
  });

  if(efeito === "fade"){
    track.style.position = "relative";
    track.style.display = "block";
  }

  let timer = null;

function mostrar(novo){
  const total = imgs.length;

  if(efeito === "slide"){
    track.style.transition = "transform .6s ease";
    track.style.transform = `translateX(-${novo * 100}%)`;

    // loop visual
    if(novo === 0){
      setTimeout(()=>{
        track.style.transition = "none";
        idx = total - 2;
        track.style.transform = `translateX(-${idx * 100}%)`;
      },600);
      return;
    }

    if(novo === total - 1){
      setTimeout(()=>{
        track.style.transition = "none";
        idx = 1;
        track.style.transform = `translateX(-${idx * 100}%)`;
      },600);
      return;
    }

    idx = novo;
    return;
  }

  // ===== FADE =====
  if(efeito === "fade"){
    if(novo < 0) novo = total - 1;
    if(novo >= total) novo = 0;

    [...track.children].forEach((img, i)=>{
      img.style.opacity = i === novo ? "1" : "0";
    });

    idx = novo;
  }
}


 function proximo(){
  if (efeito === "slide") {
    mostrar(idx + 1);
  } else {
    mostrar((idx + 1) % imgs.length);
  }
}

function anterior(){
  if (efeito === "slide") {
    mostrar(idx - 1);
  } else {
    mostrar((idx - 1 + imgs.length) % imgs.length);
  }
}

  // loop automático
  function iniciarLoop(){
    clearInterval(timer);
    timer = setInterval(proximo, intervalo);
  }

  iniciarLoop();

  /* ===== SWIPE TOUCH ===== */
  let startX = 0;

track.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
  track.style.transition = "none";
  clearInterval(timer);
}, { passive:true });


  track.addEventListener("touchend", e=>{
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if(Math.abs(diff) > 40){
      diff > 0 ? proximo() : anterior();
    }

    iniciarLoop();
  });
}


/* DATA */
function dataHora(d,h){
 if(!d) return "";
 const [y,m,da]=d.split("-");
 return `${da}/${m}/${y} ${h||""}`;
}
function formatarMoeda(valor){
  if(valor === null || valor === undefined) return "R$ 0,00";

  return Number(valor).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function ultimasVagas(data_saida){
  if(!data_saida) return false;

  const hoje = new Date();
  const saida = new Date(data_saida + "T00:00:00");

  const diff = Math.ceil(
    (saida - hoje) / (1000 * 60 * 60 * 24)
  );

  return diff >= 0 && diff <= 7; // até 7 dias
}
/* ===== AUXILIARES DO CARD ===== */

function textoParcelas(valor, parcelas){
  if(!parcelas || parcelas <= 1) return "";
  const v = valor / parcelas;
  return `${parcelas}x de ${formatarMoeda(v)}`;
}

function ufPorCep(cep){
  if(!cep || cep.length !== 8) return "";

  const faixa = Number(cep.substring(0,2));

  if(faixa >= 40 && faixa <= 49) return "BA";
  if(faixa >= 10 && faixa <= 19) return "SP";
  if(faixa >= 20 && faixa <= 28) return "RJ";
  if(faixa >= 30 && faixa <= 39) return "MG";
  if(faixa >= 50 && faixa <= 56) return "PE";
  if(faixa >= 57 && faixa <= 57) return "AL";
  if(faixa >= 58 && faixa <= 58) return "PB";
  if(faixa >= 59 && faixa <= 59) return "RN";
  if(faixa >= 60 && faixa <= 62) return "CE";
  if(faixa >= 70 && faixa <= 72) return "DF";
  if(faixa >= 73 && faixa <= 73) return "BA";
  if(faixa >= 80 && faixa <= 87) return "PR";
  if(faixa >= 88 && faixa <= 88) return "SC";
  if(faixa >= 90 && faixa <= 99) return "RS";

  return "";
}



async function carregar(){
  const {data:cfg}=await sb.from("loja_config").select("*").single();
  const {data}=await sb.from("excursoes").select("*").eq("status","Ativa");

if(cfg){
  const root = document.documentElement;

  root.style.setProperty("--primary", cfg.cor_primaria);
  root.style.setProperty("--bg", cfg.cor_fundo);
  root.style.setProperty("--card", cfg.cor_card);
  root.style.setProperty("--text", cfg.cor_texto);
  document
    .querySelector('meta[name="theme-color"]')
    .setAttribute("content", cfg.cor_primaria);

  document.body.style.opacity = "1";

startBanner(
  cfg.banners,
  cfg.banner_efeito || "slide",
  cfg.banner_intervalo || 3000
);
}


  lista.innerHTML="";

  data.forEach(e=>{
   const uf = ufPorCep(e.cep || "");
const parcelasTxt = textoParcelas(e.valor, e.parcelas);

lista.innerHTML += `





  <div class="card">
    <img src="${pub(e.poster_url)}">

    <div class="card-body">
      <h4>${e.titulo}</h4>

      <div class="meta">
        📅 ${dataHora(e.data_saida, e.hora_saida)}
      </div>

      ${uf ? `<div class="meta">📍 ${uf}</div>` : ``}

      <div class="price">${formatarMoeda(e.valor)}</div>

      ${parcelasTxt ? `<div class="meta">💳 ${parcelasTxt}</div>` : ``}

      <a
        class="btn-whats"
        href="https://wa.me/55${e.whatsapp || ''}?text=Quero%20informações%20sobre%20${encodeURIComponent(e.titulo)}"
        target="_blank"
      >
        💬 WhatsApp
      </a>
    </div>
  </div>
`;
  }); // fecha forEach
} // fecha carregar()


 

/* MODAL */
function abrir(e){
 mTitulo.innerText=e.titulo;
 mDestino.innerText=e.destino;
 mDatas.innerText=dataHora(e.data_saida,e.hora_saida)+" → "+dataHora(e.data_retorno,e.hora_retorno);
 mHero.innerHTML=`<img src="${pub(e.poster_url)}">`;
 mDetalhes.innerText=
 `Transporte: ${e.transporte}
 Hospedagem: ${e.hospedagem}
 Alimentação: ${e.alimentacao}
 Observações: ${e.observacoes||""}`;

 mInclusos.innerHTML="";
 if(e.inclui_transporte)mInclusos.innerHTML+=`<div class="tag">🚌 Transporte</div>`;
 if(e.inclui_hospedagem)mInclusos.innerHTML+=`<div class="tag">🏨 Hospedagem</div>`;
 if(e.inclui_cafe)mInclusos.innerHTML+=`<div class="tag">☕ Café</div>`;
 if(e.inclui_seguro)mInclusos.innerHTML+=`<div class="tag">🛡 Seguro</div>`;

mPagamentos.innerHTML = "";

if (e.pag_pix)
  mPagamentos.innerHTML += `<div class="tag">💳 Pix</div>`;

if (e.pag_credito)
  mPagamentos.innerHTML += `<div class="tag">💳 Crédito</div>`;

if (e.pag_debito)
  mPagamentos.innerHTML += `<div class="tag">💳 Débito</div>`;

if (e.pag_dinheiro)
  mPagamentos.innerHTML += `<div class="tag">💵 Dinheiro</div>`;

if (e.pag_parcelado)
  mPagamentos.innerHTML += `<div class="tag">📆 Parcelado</div>`;


 modal.classList.add("show");
}

function fechar(){modal.classList.remove("show")}

carregar();
</script>

</body>
</html>
