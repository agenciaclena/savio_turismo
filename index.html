<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Sávio Turismo • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#ff6a00;
  --primary-soft:rgba(255,106,0,.14);
  --bg:#f4f6fb;
  --card:#fff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
}

*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg)}

.header{
  padding:18px;
}
.header h1{
  font-size:20px;
  font-weight:800;
}
.header span{color:var(--primary)}
.header p{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  padding:0 16px 120px;
}

.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  overflow:hidden;
  cursor:pointer;
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.card-body{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card-body h4{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.badge{
  font-size:10px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary);
  width:fit-content;
}
.price{
  font-size:13px;
  font-weight:800;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  z-index:9999;
}
.modal.show{display:flex}

.sheet{
  width:100%;
  height:94vh;
  background:#fff;
  border-radius:24px 24px 0 0;
  display:flex;
  flex-direction:column;
}

.sheet-header{
  padding:16px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.sheet-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.sheet-footer{
  padding:14px;
  border-top:1px solid var(--border);
}

.btn{
  width:100%;
  height:48px;
  border-radius:999px;
  border:none;
  font-weight:800;
  font-size:14px;
}
.btn-primary{
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}

.hero{
  height:180px;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:16px;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.section{
  margin-bottom:16px;
}
.section h3{
  font-size:14px;
  font-weight:800;
  margin-bottom:6px;
}
.section p{
  font-size:13px;
  color:var(--muted);
  white-space:pre-line;
}

.flags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.flag{
  background:#e0f2fe;
  color:#0369a1;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="header">
  <h1>Sávio <span>Turismo</span></h1>
  <p>Excursões disponíveis</p>
</div>

<div class="grid" id="lista"></div>

<!-- SHEET DETALHES -->
<div class="modal" id="modal">
  <div class="sheet">

    <div class="sheet-header">
      <span id="titulo"></span>
      <span onclick="fechar()">✕</span>
    </div>

    <div class="sheet-body">

      <div class="hero" id="hero"></div>

      <div class="section">
        <h3>Destino</h3>
        <p id="destino"></p>
      </div>

      <div class="section">
        <h3>Datas</h3>
        <p id="datas"></p>
      </div>

      <div class="section">
        <h3>Descrição</h3>
        <p id="descricao"></p>
      </div>

      <div class="section" id="boxRoteiro" style="display:none">
        <h3>Roteiro</h3>
        <p id="roteiro"></p>
      </div>

      <div class="section" id="boxFlags">
        <h3>Inclusos</h3>
        <div class="flags" id="flags"></div>
      </div>

    </div>

    <div class="sheet-footer">
      <button class="btn btn-primary" onclick="adquirir()">
        Adquirir esta viagem
      </button>
    </div>

  </div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

let excursaoAtual = null;

async function carregar(){
  const {data} = await sb
    .from("excursoes")
    .select("*")
    .eq("ativo",true)
    .order("data_saida");

  lista.innerHTML = "";

  data.forEach(e=>{
    lista.innerHTML += `
      <div class="card" onclick='abrir(${JSON.stringify(e)})'>
        ${e.poster_url ? `<img src="${publicImg(e.poster_url)}">` : ``}
        <div class="card-body">
          <h4>${e.titulo}</h4>
          <span class="badge">${e.destino}</span>
          <span class="price">R$ ${Number(e.valor).toLocaleString("pt-BR",{minimumFractionDigits:2})}</span>
        </div>
      </div>
    `;
  });
}

function publicImg(path){
  return sb.storage.from("posters-excursoes").getPublicUrl(path).data.publicUrl;
}

function abrir(e){
  excursaoAtual = e;
  titulo.innerText = e.titulo;
  destino.innerText = e.destino;
  datas.innerText = formatarData(e.data_saida)+" → "+formatarData(e.data_retorno);
  descricao.innerText = e.descricao || "";

  hero.innerHTML = e.poster_url
    ? `<img src="${publicImg(e.poster_url)}">`
    : "";

  if(e.roteiro){
    boxRoteiro.style.display="block";
    roteiro.innerText=e.roteiro;
  }else{
    boxRoteiro.style.display="none";
  }

  flags.innerHTML="";
  if(e.inclui_cafe) flags.innerHTML+=`<div class="flag">☕ Café</div>`;
  if(e.inclui_seguro) flags.innerHTML+=`<div class="flag">🛡 Seguro</div>`;
  if(e.inclui_guia) flags.innerHTML+=`<div class="flag">🧑‍✈️ Guia</div>`;
  if(e.inclui_transporte) flags.innerHTML+=`<div class="flag">🚌 Transporte</div>`;

  modal.classList.add("show");
}

function fechar(){
  modal.classList.remove("show");
}

function formatarData(d){
  const [y,m,day]=d.split("-");
  return `${day}/${m}/${y}`;
}

function adquirir(){
  alert("Próximo passo: cadastro do cliente + contrato");
}

carregar();
</script>

</body>
</html>
