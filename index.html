<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sávio Turismo • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#ff6a00;
  --primary-soft:rgba(255,106,0,.14);
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
}

*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg)}

.header{
  padding:18px 16px 10px;
}
.header h1{font-size:20px;font-weight:800}
.header span{color:var(--primary)}
.header p{font-size:12px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
  padding:0 16px 140px;
}

.card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 26px rgba(0,0,0,.08);
  overflow:hidden;
  cursor:pointer;
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.card-body{
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card-body h4{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.badge{
  font-size:10px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  background:var(--primary-soft);
  color:var(--primary);
  width:fit-content;
}
.price{font-size:13px;font-weight:800}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:flex-end;
  z-index:9999;
}
.modal.show{display:flex}

.sheet{
  width:100%;
  height:94vh;
  background:#fff;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}

.sheet-header{
  padding:16px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.sheet-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.sheet-footer{
  padding:14px;
  border-top:1px solid var(--border);
}

.hero{
  height:190px;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.section{margin-bottom:18px}
.section h3{font-size:14px;font-weight:800}
.section p{font-size:13px;color:var(--muted);white-space:pre-line}

.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{
  background:#e0f2fe;
  color:#0369a1;
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.btn{
  width:100%;
  height:50px;
  border-radius:999px;
  border:none;
  font-weight:800;
  font-size:15px;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
</style>
</head>

<body>

<div class="header">
  <h1>Sávio <span>Turismo</span></h1>
  <p>Escolha sua próxima experiência</p>
</div>

<div class="grid" id="lista"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-header">
      <span id="sheetTitulo"></span>
      <span onclick="fechar()">✕</span>
    </div>

    <div class="sheet-body">
      <div class="hero" id="hero"></div>

      <div class="section">
        <h3>Destino</h3>
        <p id="sheetDestino"></p>
      </div>

      <div class="section">
        <h3>Período</h3>
        <p id="sheetDatas"></p>
      </div>

      <div class="section" id="boxDescricao" style="display:none">
        <h3>Descrição</h3>
        <p id="sheetDescricao"></p>
      </div>

      <div class="section" id="boxRoteiro" style="display:none">
        <h3>Roteiro</h3>
        <p id="sheetRoteiro"></p>
      </div>

      <div class="section" id="boxInclusos" style="display:none">
        <h3>Incluso no pacote</h3>
        <div class="flags" id="flags"></div>
      </div>
    </div>

    <div class="sheet-footer">
      <button class="btn" onclick="adquirir()">Quero garantir minha vaga</button>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

function imgPublica(path){
  return sb.storage.from("buffet_excursoes")
    .getPublicUrl(path).data.publicUrl;
}

async function carregar(){
  const {data} = await sb
    .from("excursoes")
    .select("*")
    .order("data_saida");

  lista.innerHTML="";

  data.forEach(e=>{
    const img = e.poster_url ? imgPublica(e.poster_url) : "";
    lista.innerHTML+=`
      <div class="card" onclick='abrir(${JSON.stringify(e)})'>
        ${img?`<img src="${img}">`:``}
        <div class="card-body">
          <h4>${e.titulo}</h4>
          <span class="badge">${e.destino}</span>
          <span class="price">
            R$ ${Number(e.valor).toLocaleString("pt-BR",{minimumFractionDigits:2})}
          </span>
        </div>
      </div>`;
  });
}

function abrir(e){
  sheetTitulo.innerText=e.titulo;
  sheetDestino.innerText=e.destino;
  sheetDatas.innerText=formatarData(e.data_saida)+" → "+formatarData(e.data_retorno);
  hero.innerHTML=e.poster_url?`<img src="${imgPublica(e.poster_url)}">`:"";

  boxDescricao.style.display=e.descricao?"block":"none";
  sheetDescricao.innerText=e.descricao||"";

  boxRoteiro.style.display=e.roteiro?"block":"none";
  sheetRoteiro.innerText=e.roteiro||"";

  flags.innerHTML="";
  let ok=false;
  if(e.inclui_cafe){flags.innerHTML+=`<div class="flag">☕ Café</div>`;ok=true}
  if(e.inclui_seguro){flags.innerHTML+=`<div class="flag">🛡 Seguro</div>`;ok=true}
  if(e.inclui_guia){flags.innerHTML+=`<div class="flag">🧑‍✈️ Guia</div>`;ok=true}
  if(e.inclui_transporte){flags.innerHTML+=`<div class="flag">🚌 Transporte</div>`;ok=true}
  boxInclusos.style.display=ok?"block":"none";

  modal.classList.add("show");
}

function fechar(){modal.classList.remove("show")}
function formatarData(d){const [y,m,da]=d.split("-");return `${da}/${m}/${y}`}
function adquirir(){alert("Próximo passo: cadastro do cliente")}

carregar();
</script>

</body>
</html>
