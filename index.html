<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sávio Turismo • Excursões</title>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary: transparent;
  --bg: transparent;
  --card: transparent;
  --text: #111827;
  --muted:#6b7280;
  --radius:22px;
}

*{box-sizing:border-box;font-family:Inter}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  opacity:0;
  transition:opacity .2s ease;
}


/* HEADER */
.header{
  padding:20px 16px 10px;
}
.header h1{font-size:22px;font-weight:800}
.header span{color:var(--primary)}
.header p{font-size:13px;color:var(--muted)}

/* BANNER */
.banner{
  margin:0 16px 18px;
  border-radius:28px;
  overflow:hidden;
  position:relative;
}

.banner-track{
  display:flex;
  height:200px;
  transition:transform .6s ease;
  will-change:transform;
}

.banner-track img{
  min-width:100%;
  height:100%;
  object-fit:cover;
  user-select:none;
  pointer-events:none;
}


/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
  padding:0 16px 160px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 26px rgba(0,0,0,.08);
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.card-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.card-body h4{
  font-size:14px;
  font-weight:800;
}
.price{
  font-weight:900;
}
.meta{
  font-size:12px;
  color:var(--muted);
}

.btn-whats{
  margin-top:8px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  background:#25d366;
  color:#fff;
  font-size:13px;
  font-weight:800;
  text-decoration:none;
}

.flags{
  display:flex;
  gap:6px;
}
.flag{
  width:10px;height:10px;
  border-radius:50%;
  background:#cbd5e1;
}
.flag.on{background:var(--primary)}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:flex-end;
  z-index:9999;
}
.modal.show{display:flex}

.sheet{
  width:100%;
  height:95vh;
  background:#fff;
  border-radius:28px 28px 0 0;
  display:flex;
  flex-direction:column;
}
.sheet-header{
  padding:16px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
}
.sheet-body{
  flex:1;
  overflow:auto;
  padding:16px;
}
.hero{
  height:220px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:18px;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.section{margin-bottom:16px}
.section h3{font-size:14px;font-weight:800}
.section p{font-size:13px;color:var(--muted);white-space:pre-line}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.tag{
  background:#e0f2fe;
  color:#0369a1;
  padding:6px 12px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.btn{
  width:100%;
  height:52px;
  border-radius:999px;
  border:none;
  font-weight:800;
  font-size:15px;
  background:linear-gradient(135deg,#ff6a00,#ff9a57);
  color:#fff;
}
.ultimas-vagas{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:900;
  color:#dc2626;
}

.pulse{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#dc2626;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:1}
  50%{transform:scale(1.4);opacity:.6}
  100%{transform:scale(1);opacity:1}
}
/* STORIES BAR */
.stories-bar{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:12px 16px 6px;
  scrollbar-width:none;
}
.stories-bar::-webkit-scrollbar{display:none}

.story{
  width:70px;
  text-align:center;
  cursor:pointer;
  flex-shrink:0;
}

.story img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--primary); /* 🔥 MESMA COR DO NOME */
}

.story span{
  display:block;
  font-size:11px;
  font-weight:700;
  margin-top:6px;
  color:var(--text);
}
#storyBody iframe{
  width:100% !important;
  max-width:420px;
  margin:0 auto;
  border-radius:18px;
}

#storyBody{
  display:flex;
  justify-content:center;
}

</style>
</head>

<body>

<div class="header">
  <h1>Sávio <span>Turismo</span></h1>
  <p>Escolha sua próxima experiência</p>
</div>

<div class="banner">
  <div class="banner-track" id="bannerTrack"></div>
</div>

<!-- STORIES (AQUI 👇) -->
<div class="stories-bar" id="stories"></div>

<!-- LISTA -->
<div class="grid" id="lista"></div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="sheet">
  <div class="sheet-header">
    <span id="mTitulo"></span>
    <span onclick="fechar()">✕</span>
  </div>
  <div class="sheet-body">
    <div class="hero" id="mHero"></div>

    <div class="section"><h3>Destino</h3><p id="mDestino"></p></div>
    <div class="section"><h3>Período</h3><p id="mDatas"></p></div>
    <div class="section"><h3>Detalhes</h3><p id="mDetalhes"></p></div>

    <div class="section">
      <h3>Inclusos</h3>
      <div class="tags" id="mInclusos"></div>
    </div>

    <div class="section">
      <h3>Formas de pagamento</h3>
      <div class="tags" id="mPagamentos"></div>
    </div>
  </div>

<div class="sheet-actions">
  <a
    id="btnWhats"
    class="btn-whats-circle"
    href="#"
    target="_blank"
    aria-label="WhatsApp"
  >
    💬
  </a>

  <button
    id="btnComprar"
    class="btn btn-comprar"
  >
    Adquirir
  </button>
</div>

</div>
</div>

<script>
const sb = supabase.createClient(
 "https://ghkfeobnrfvqwzuliqfz.supabase.co",
 "sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t"
);

function pub(path){
  if(!path) return "";
  return sb.storage.from("buffet_excursoes").getPublicUrl(path).data.publicUrl;
}

/* ===================== BANNER ===================== */
let idx = 0;

function startBanner(imgs, efeito = "slide", intervalo = 3000){
  const track = document.getElementById("bannerTrack");
  track.innerHTML = "";
  idx = 0;

  if(!imgs || imgs.length === 0) return;

  if(efeito === "slide" && imgs.length > 1){
    imgs = [imgs[imgs.length - 1], ...imgs, imgs[0]];
    idx = 1;
  }

  track.style.display = "flex";
  track.style.transition = "none";
  track.style.transform = efeito === "slide" ? "translateX(-100%)" : "translateX(0)";

  imgs.forEach((src, i)=>{
    const img = document.createElement("img");
    img.src = src;

    if(efeito === "fade"){
      img.style.position = "absolute";
      img.style.inset = 0;
      img.style.opacity = i === 0 ? "1" : "0";
      img.style.transition = "opacity .6s ease";
    }

    track.appendChild(img);
  });

  if(efeito === "fade"){
    track.style.position = "relative";
    track.style.display = "block";
  }

  let timer = null;

  function mostrar(novo){
    const total = imgs.length;

    if(efeito === "slide"){
      track.style.transition = "transform .6s ease";
      track.style.transform = `translateX(-${novo * 100}%)`;

      if(novo === 0){
        setTimeout(()=>{
          track.style.transition = "none";
          idx = total - 2;
          track.style.transform = `translateX(-${idx * 100}%)`;
        },600);
        return;
      }

      if(novo === total - 1){
        setTimeout(()=>{
          track.style.transition = "none";
          idx = 1;
          track.style.transform = `translateX(-${idx * 100}%)`;
        },600);
        return;
      }

      idx = novo;
      return;
    }

    if(efeito === "fade"){
      if(novo < 0) novo = total - 1;
      if(novo >= total) novo = 0;

      [...track.children].forEach((img, i)=>{
        img.style.opacity = i === novo ? "1" : "0";
      });

      idx = novo;
    }
  }

  function proximo(){
    mostrar(idx + 1);
  }

  function anterior(){
    mostrar(idx - 1);
  }

  function iniciarLoop(){
    clearInterval(timer);
    timer = setInterval(proximo, intervalo);
  }

  iniciarLoop();

  let startX = 0;

  track.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
    clearInterval(timer);
  }, { passive:true });

  track.addEventListener("touchend", e=>{
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if(Math.abs(diff) > 40){
      diff > 0 ? proximo() : anterior();
    }

    iniciarLoop();
  });
}

/* ===================== FORMATADORES ===================== */
function dataHora(d,h){
  if(!d) return "";
  const [y,m,da] = d.split("-");
  return `${da}/${m}/${y}${h ? " " + h.slice(0,5) : ""}`;
}

function formatarMoeda(v){
  if(v === null || v === undefined) return "R$ 0,00";
  return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function textoParcelas(valor, parcelas){
  if(!parcelas || parcelas <= 1) return "";
  return `${parcelas}x de ${formatarMoeda(valor/parcelas)}`;
}

function ufPorCep(cep){
  if(!cep || cep.length !== 8) return "";
  const f = Number(cep.substring(0,2));
  if(f>=40 && f<=49) return "BA";
  if(f>=10 && f<=19) return "SP";
  if(f>=20 && f<=28) return "RJ";
  if(f>=30 && f<=39) return "MG";
  if(f>=50 && f<=56) return "PE";
  if(f==57) return "AL";
  if(f==58) return "PB";
  if(f==59) return "RN";
  if(f>=60 && f<=62) return "CE";
  if(f>=70 && f<=72) return "DF";
  if(f>=80 && f<=87) return "PR";
  if(f==88) return "SC";
  if(f>=90) return "RS";
  return "";
}

/* ===================== CARREGAR ===================== */
let itens = [];

async function carregar(){
  const {data:cfg} = await sb.from("loja_config").select("*").single();
  const {data} = await sb.from("excursoes").select("*").eq("status","Ativa");

  if(cfg){
    const r = document.documentElement;
    r.style.setProperty("--primary", cfg.cor_primaria);
    r.style.setProperty("--bg", cfg.cor_fundo);
    r.style.setProperty("--card", cfg.cor_card);
    r.style.setProperty("--text", cfg.cor_texto);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", cfg.cor_primaria);
    document.body.style.opacity = "1";

    startBanner(cfg.banners, cfg.banner_efeito, cfg.banner_intervalo);
  }

  itens = data || [];
  lista.innerHTML = "";

  itens.forEach(e=>{
    const uf = ufPorCep(e.cep || "");
    const parcelasTxt = textoParcelas(e.valor, e.parcelas);

    lista.innerHTML += `
      <div class="card" onclick='abrir("${e.id}")'>
        <img src="${pub(e.poster_url)}">
        <div class="card-body">
          <h4>${e.titulo}</h4>
          <div class="meta">📅 ${dataHora(e.data_saida,e.hora_saida)}</div>
          ${uf ? `<div class="meta">📍 ${uf}</div>` : ``}
          <div class="price">${formatarMoeda(e.valor)}</div>
          ${parcelasTxt ? `<div class="meta">💳 ${parcelasTxt}</div>` : ``}
        </div>
      </div>
    `;
  });
}
async function carregarStories(){
  const { data } = await sb
    .from("stories")
    .select("*")
    .eq("ativo", true)
.order("linha", { ascending:true })
.order("ordem", { ascending:true })
    .limit(5);

  const box = document.getElementById("stories");
  box.innerHTML = "";

  (data || []).forEach(s=>{
    box.innerHTML += `
      <div class="story" onclick="abrirStory('${s.instagram_url}','${s.titulo||""}')">
<img src="${s.thumbnail_url || pub('default_story.jpg')}">
        <span>${s.titulo||""}</span>
      </div>
    `;
  });
}
function abrirStory(url, titulo){
  storyTitulo.innerText = titulo;
  storyBody.innerHTML = `
    <blockquote class="instagram-media"
      data-instgrm-permalink="${url}"
      data-instgrm-version="14">
    </blockquote>
  `;
  storyModal.classList.add("show");

  setTimeout(()=>{
    if(window.instgrm) window.instgrm.Embeds.process();
  },100);
}

function fecharStory(e){
  if(e && e.target !== e.currentTarget) return;
  storyModal.classList.remove("show");
  storyBody.innerHTML = "";
}

/* ===================== MODAL ===================== */
function abrir(id){
  const e = itens.find(i=>i.id===id);
  if(!e) return;

  mTitulo.innerText = e.titulo;
  mDestino.innerText = e.destino;
  mDatas.innerText = dataHora(e.data_saida,e.hora_saida)+" → "+dataHora(e.data_retorno,e.hora_retorno);
  mHero.innerHTML = `<img src="${pub(e.poster_url)}">`;

  mDetalhes.innerText =
`Transporte: ${e.transporte}
Hospedagem: ${e.hospedagem}
Alimentação: ${e.alimentacao}
Observações: ${e.observacoes||""}`;

  mInclusos.innerHTML = "";
  if(e.inclui_transporte) mInclusos.innerHTML += `<div class="tag">🚌 Transporte</div>`;
  if(e.inclui_hospedagem) mInclusos.innerHTML += `<div class="tag">🏨 Hospedagem</div>`;
  if(e.inclui_cafe) mInclusos.innerHTML += `<div class="tag">☕ Café</div>`;
  if(e.inclui_seguro) mInclusos.innerHTML += `<div class="tag">🛡 Seguro</div>`;

  mPagamentos.innerHTML = "";
  if(e.pag_pix) mPagamentos.innerHTML += `<div class="tag">💳 Pix</div>`;
  if(e.pag_credito) mPagamentos.innerHTML += `<div class="tag">💳 Crédito</div>`;
  if(e.pag_debito) mPagamentos.innerHTML += `<div class="tag">💳 Débito</div>`;
  if(e.pag_dinheiro) mPagamentos.innerHTML += `<div class="tag">💵 Dinheiro</div>`;
  if(e.pag_parcelado) mPagamentos.innerHTML += `<div class="tag">📆 Parcelado</div>`;

  document.getElementById("btnWhats").href =
    `https://wa.me/55${e.whatsapp||""}?text=Quero%20informações%20sobre%20${encodeURIComponent(e.titulo)}`;

  document.getElementById("btnComprar").onclick = ()=>{
    location.href = "cadastro.html?id="+e.id;
  };

  modal.classList.add("show");
}

function fechar(){
  modal.classList.remove("show");
}

carregar();
carregarStories();
</script>
<div class="modal" id="storyModal" onclick="fecharStory(event)">
  <div class="sheet" style="height:100%">
    <div class="sheet-header">
      <span id="storyTitulo"></span>
      <span onclick="fecharStory()">✕</span>
    </div>
    <div class="sheet-body" id="storyBody"></div>
  </div>
</div>
<script>
  const storyModal = document.getElementById("storyModal");
  const storyTitulo = document.getElementById("storyTitulo");
  const storyBody = document.getElementById("storyBody");
</script>

<script async src="https://www.instagram.com/embed.js"></script>


</body>
</html>
