<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel da Loja | Excursões</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f6f8;
  --primary:#0f172a;
  --accent:#2563eb;
  --card:#ffffff;
  --border:#e5e7eb;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111827;
}

header{
  background:linear-gradient(135deg,#020617,#0f172a);
  color:#fff;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}

h2{
  margin:0 0 14px;
  font-size:18px;
}

.grid{
  display:grid;
  gap:14px;
}

.grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
}

textarea{resize:vertical}

button{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  cursor:pointer;
}

button:hover{filter:brightness(1.1)}

.hidden{display:none}

/* Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}

.card-exc{
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:#fff;
}

.card-exc img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-exc .info{
  padding:14px;
  display:grid;
  gap:6px;
}

.badge{
  background:#e0e7ff;
  color:#1e40af;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  width:fit-content;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-content{
  background:#fff;
  width:95%;
  max-width:900px;
  border-radius:18px;
  overflow:auto;
  max-height:95vh;
}

.modal-header{
  padding:16px;
  background:#0f172a;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-body{
  padding:20px;
}

.close{
  cursor:pointer;
  font-size:22px;
}
</style>
</head>

<body>

<header>
  🏖️ Painel da Loja – Excursões
  <span>Sistema Interno</span>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h2>Login</h2>
  <div class="grid">
    <input id="email" placeholder="E-mail">
    <input id="password" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>
</div>

<!-- DASH -->
<div id="dashboard" class="hidden">

<!-- LOJA -->
<div class="card">
  <h2>🏢 Dados da Empresa</h2>
  <div class="grid grid-2">
    <input id="nome_fantasia" placeholder="Nome Fantasia">
    <input id="razao_social" placeholder="Razão Social">
    <input id="cnpj" placeholder="CNPJ">
    <input id="telefone" placeholder="Telefone">
    <input id="endereco" placeholder="Endereço">
  </div>
  <br>
  <button onclick="salvarLoja()">Salvar Dados</button>
</div>

<!-- NOVA -->
<div class="card">
  <h2>🧳 Nova Excursão</h2>
  <div class="grid grid-2">
    <input id="titulo" placeholder="Título">
    <input id="destino" placeholder="Destino">
  </div>

  <textarea id="descricao" placeholder="Descrição completa"></textarea>

  <div class="grid grid-3">
    <input id="data_saida" placeholder="Data Saída (dd/mm/aaaa)">
    <input id="data_retorno" placeholder="Data Retorno (dd/mm/aaaa)">
    <input id="valor" placeholder="Valor por pessoa">
  </div>

  <input type="file" id="poster" accept="image/*">

  <br>
  <button onclick="salvarExcursao()">Cadastrar</button>
</div>

<!-- LISTA -->
<div class="card">
  <h2>📋 Excursões</h2>
  <div class="cards" id="listaExcursao"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal hidden" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalTitulo"></span>
      <span class="close" onclick="fecharModal()">×</span>
    </div>
    <div class="modal-body">
      <img id="modalImg" style="width:100%;border-radius:14px;margin-bottom:14px">
      <input type="file" id="modalPoster">
      <br><br>
      <button onclick="atualizarPoster()">Atualizar Imagem</button>
    </div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient(
  'https://ghkfeobnrfvqwzuliqfz.supabase.co',
  'sb_publishable_R-eenS9xurRgnrqDR9kz0Q_kJonEi7t'
);

let userId=null, excursaoAtual=null;

// LOGIN
async function login(){
  const {data,error} = await supabaseClient.auth.signInWithPassword({
    email:email.value,
    password:password.value
  });
  if(error) return alert(error.message);
  userId=data.user.id;
  loginBox.classList.add('hidden');
  dashboard.classList.remove('hidden');
  carregarLoja();
  carregarExcursao();
}

// LOJA
async function carregarLoja(){
  const {data} = await supabaseClient.from('loja_profile').select('*').eq('id',userId).single();
  if(data){
    nome_fantasia.value=data.nome_fantasia||'';
    razao_social.value=data.razao_social||'';
    cnpj.value=data.cnpj||'';
    telefone.value=data.telefone||'';
    endereco.value=data.endereco||'';
  }
}

async function salvarLoja(){
  await supabaseClient.from('loja_profile').upsert({
    id:userId,
    nome_fantasia:nome_fantasia.value,
    razao_social:razao_social.value,
    cnpj:cnpj.value,
    telefone:telefone.value,
    endereco:endereco.value
  });
  alert('Dados salvos');
}

// EXCURSÕES
async function salvarExcursao(){
  let posterUrl=null;
  if(poster.files[0]){
    const path=`${userId}/${Date.now()}-${poster.files[0].name}`;
    const {data} = await supabaseClient.storage.from('posters-excursoes').upload(path,poster.files[0]);
    posterUrl=data.path;
  }

  await supabaseClient.from('excursoes').insert({
    loja_id:userId,
    titulo:titulo.value,
    destino:destino.value,
    descricao:descricao.value,
    data_saida:data_saida.value,
    data_retorno:data_retorno.value,
    valor:valor.value,
    poster_url:posterUrl,
    ativo:true
  });

  carregarExcursao();
}

async function carregarExcursao(){
  const {data} = await supabaseClient.from('excursoes').select('*').eq('loja_id',userId);
  listaExcursao.innerHTML='';
  data.forEach(e=>{
    listaExcursao.innerHTML+=`
      <div class="card-exc" onclick="abrirModal('${e.id}','${e.poster_url||''}','${e.titulo}')">
        ${e.poster_url?`<img src="https://ghkfeobnrfvqwzuliqfz.supabase.co/storage/v1/object/public/posters-excursoes/${e.poster_url}">`:''}
        <div class="info">
          <strong>${e.titulo}</strong>
          <span class="badge">${e.destino}</span>
          <div>💰 ${e.valor}</div>
        </div>
      </div>`;
  });
}

// MODAL
function abrirModal(id,img,titulo){
  excursaoAtual=id;
  modalTitulo.innerText=titulo;
  modalImg.src=img?`https://ghkfeobnrfvqwzuliqfz.supabase.co/storage/v1/object/public/posters-excursoes/${img}`:'';
  modal.classList.remove('hidden');
}

function fecharModal(){
  modal.classList.add('hidden');
}

async function atualizarPoster(){
  if(!modalPoster.files[0]) return;
  const path=`${userId}/${Date.now()}-${modalPoster.files[0].name}`;
  const {data} = await supabaseClient.storage.from('posters-excursoes').upload(path,modalPoster.files[0]);
  await supabaseClient.from('excursoes').update({poster_url:data.path}).eq('id',excursaoAtual);
  fecharModal();
  carregarExcursao();
}
</script>

</body>
</html>
